apply plugin: 'com.android.application'

/**
 * Две сборки одного приложения:
 *
 *  - dev  — applicationId ru.ryadom.companion.dev, ставится рядом с боевой, по умолчанию ходит на локальный сервер,
 *           содержит переключатель сред;
 *  - prod — то, что попадает в магазины.
 *
 * versionCode и versionName приходят из CI.
 * Локально они равны 1 и версии из package.json, чтобы `assembleDevDebug` собирался без
 * переменных окружения.
 */

def envOr = { String name, String fallback ->
    def value = System.getenv(name)
    return (value == null || value.trim().isEmpty()) ? fallback : value.trim()
}

def appVersionName = envOr('RYADOM_VERSION_NAME', '0.1.0')
def appVersionCode = envOr('RYADOM_VERSION_CODE', '1').toInteger()
def keystorePath = envOr('RYADOM_KEYSTORE_PATH', '')
// One debug key for the whole team: a RuStore push project accepts a single SHA-256, so builds signed with
// personal ~/.android keys never get test pushes. Fetched by `pnpm android:debug-key`, see android/README.md.
def teamDebugKeystore = rootProject.file('keystores/debug.keystore')
// A RuStore push project is bound to one package and one signature, so each flavor has its own: "Тест" for
// ru.ryadom.companion.dev with the team debug key, "Production" for ru.ryadom.companion with the release key. The ids
// are not secrets: the service tokens that send are on the server only.
def rustorePushProjects = [dev: '2FNQq2fB-JZapsB7soi5H3RHhT4NX0-W', prod: '83ddAYvI5vjo137Zw0bnLR6-N9srB04G']

android {
    namespace = "ru.ryadom.app"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        // The package of the app in RuStore, fixed there. The Java package (namespace) is unrelated and stays.
        applicationId "ru.ryadom.companion"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        debug {
            if (teamDebugKeystore.exists()) {
                storeFile teamDebugKeystore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            } else {
                // A warning, not a failure: builds without RuStore pushes (emulator, UI checks) still work.
                logger.warn("Team debug key not found (${teamDebugKeystore}): debug builds are signed with the " +
                    "personal key and will not receive RuStore test pushes. Run `pnpm android:debug-key`.")
            }
        }
        release {
            // Ключ есть только в CI: без него release-сборка соберётся неподписанной, а не
            // упадёт на непонятной ошибке Gradle.
            if (!keystorePath.isEmpty()) {
                storeFile file(keystorePath)
                storePassword envOr('RYADOM_KEYSTORE_PASSWORD', '')
                keyAlias envOr('RYADOM_KEY_ALIAS', '')
                keyPassword envOr('RYADOM_KEY_PASSWORD', '')
            }
        }
    }

    flavorDimensions += "environment"

    productFlavors {
        // The SDK reads its project from the manifest; the plugin reports the same one to the server.
        dev {
            dimension "environment"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            resValue "string", "app_name", "Рядом dev"
            manifestPlaceholders = [rustorePushProjectId: rustorePushProjects.dev]
            resValue "string", "rustore_push_project_id", rustorePushProjects.dev
        }
        prod {
            dimension "environment"
            resValue "string", "app_name", "Рядом"
            manifestPlaceholders = [rustorePushProjectId: rustorePushProjects.prod]
            resValue "string", "rustore_push_project_id", rustorePushProjects.prod
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (!keystorePath.isEmpty()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "ru.rustore.sdk:pushclient:7.5.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
