<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#00051a" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Рядом</title>
    <style>
      /* Shown before React's first paint: the same background and mark as the system splash. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #00051a;
      }
      .ryadom-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .ryadom-boot svg {
        width: 72px;
        height: 72px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="ryadom-boot" aria-hidden="true">
        <svg viewBox="0 0 64 64">
          <rect width="64" height="64" rx="16" fill="#00051a" />
          <circle cx="26" cy="32" r="12" fill="none" stroke="#f1f4ff" stroke-width="4" />
          <circle cx="43" cy="32" r="7" fill="none" stroke="#2e8fff" stroke-width="4" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
