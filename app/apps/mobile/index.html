<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#00051a" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Рядом</title>
    <style>
      /* Shown before React's first paint: the same background and mark as the system splash. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #00051a;
      }
      /* The day boot, chosen by the script below before any stylesheet arrives. */
      html[data-theme='light'],
      html[data-theme='light'] body {
        background: #f4f6fd;
      }
      html[data-theme='light'] .ryadom-boot rect {
        fill: #f4f6fd;
      }
      html[data-theme='light'] .ryadom-boot circle:first-of-type {
        stroke: #10152e;
      }
      .ryadom-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .ryadom-boot svg {
        width: 72px;
        height: 72px;
      }
    </style>
    <script>
      /*
       * The theme before the first paint, so the day schedule never flashes the night palette: the
       * saved manual choice wins, otherwise light 07:00–21:59 local. The native shell is always dark
       * and keeps the defaults above. Mirrors packages/client-core/src/theme.ts; ThemeSwitch takes
       * over from the root attribute once the app is up.
       */
      ;(function () {
        try {
          var cap = window.Capacitor
          if (
            (cap && typeof cap.isNativePlatform === 'function' && cap.isNativePlatform()) ||
            location.protocol === 'capacitor:'
          )
            return
          var saved = null
          try {
            saved = localStorage.getItem('ryadom.theme')
          } catch (e) {}
          var theme
          if (saved === 'light' || saved === 'dark') theme = saved
          else {
            var hour = new Date().getHours()
            theme = hour >= 7 && hour < 22 ? 'light' : 'dark'
          }
          if (theme !== 'light') return
          var root = document.documentElement
          root.setAttribute('data-theme', 'light')
          root.style.colorScheme = 'light'
          var themeColor = document.querySelector('meta[name="theme-color"]')
          if (themeColor) themeColor.setAttribute('content', '#f4f6fd')
          var colorScheme = document.querySelector('meta[name="color-scheme"]')
          if (colorScheme) colorScheme.setAttribute('content', 'light')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app">
      <div class="ryadom-boot" aria-hidden="true">
        <svg viewBox="0 0 64 64">
          <rect width="64" height="64" rx="16" fill="#00051a" />
          <circle cx="26" cy="32" r="12" fill="none" stroke="#f1f4ff" stroke-width="4" />
          <circle cx="43" cy="32" r="7" fill="none" stroke="#2e8fff" stroke-width="4" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
