# Dev only. Mounted by docker-compose.yaml into the PWA image (/etc/nginx/dev.d/, included inside its
# server block). The image itself has no proxy: in production the gateway routes `/api` of the same
# host to the API, and the PWA client relies on that (apiBase is empty, the WebSocket URL comes from
# window.location). Without a gateway in compose, this does the gateway's job.
location /api/ {
  proxy_pass http://api:3002;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  # The dialog runs over a WebSocket.
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 1h;
  proxy_send_timeout 1h;
  proxy_buffering off;
  # Any add_header in a location drops the server-level ones, so the PWA's CSP and Cache-Control
  # headers do not land on API responses. This one is only a marker for that.
  add_header X-Ryadom-Dev-Proxy 1 always;
}
