schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Продукт: «Слышу Рядом» — голосовой ИИ-компаньон эмоциональной поддержки (Sber500xDisrupt).
  Спека: spec_slyshu_ryadom.pdf (v1.1). Аудитория 18+, 152-ФЗ, данные только в РФ,
  анонимный device-based вход, «стереть всё» одной кнопкой, кризисный протокол
  перекрывает любой режим и любую метрику.

  Единый источник правды по API: OpenSpec (openspec/specs/ — утверждённые capabilities,
  openspec/changes/ — активные предложения) + docs/openapi.yaml (OpenAPI 3.1,
  41 операция, для понимания и генерации клиентов).
  Любые задачи backend ОБЯЗАНЫ соответствовать specs; расхождения —
  сначала правим specs, потом код.

  Tech stack backend: Python 3.12, FastAPI, WebSocket (голос/текст стриминг),
  SQLAlchemy async, PostgreSQL 16 + pgvector, Redis 8 + Sentinel (сессии, очереди,
  rate-limit), Celery + beat (фон: суммаризация, консолидация памяти, пуши),
  GigaChat (LLM), SaluteSpeech (ASR/TTS стриминг), Langfuse (трейсинг),
  ClickHouse (события/метрика конкурса). Клиенты — приложение в app/ (см. ниже).

  Приложение (каталог app/ — отдельный pnpm + Turborepo монорепозиторий на TypeScript, Node >= 24):
  - apps/web — веб-приложение за логином (Next.js 16, React 19, Tailwind 4, shadcn/ui из packages/ui);
  - apps/mobile — мобильный клиент (Framework7 + Capacitor 8 + Vite): PWA, Android, iOS;
  - apps/landing — публичный сайт (Next.js): лендинг, /privacy, /terms, /download, /delete-account;
  - apps/admin — админка (Next.js): пользователи, блокировки, удаление аккаунтов, журнал действий;
  - services/api — API приложения (Hono): REST /api/*, WebSocket-шлюз к агенту /api/dialogs/ws,
    раздача PWA и OTA-сборки мобильного клиента; PostgreSQL через Drizzle (packages/db);
  - packages/{contracts,client-core,core,db,design,ui}; dev/agent-mock — заглушка агента для
    разработки; e2e — сквозные тесты Playwright.
  Клиенты ходят только в app/services/api, он вызывает агента по agent-api (REST + WebSocket).
  backend/ приложением сейчас не вызывается: у приложения свой вход по почте и паролю (не
  device-based), свои маршруты /api/* и свои данные.
  Источник правды по поведению клиентов, публичных сайтов и админки и по доставке мобильного
  клиента (PWA, сборки Android/iOS, обновления) — specs client-*, landing-site, admin-console,
  pwa-delivery, native-app-build, app-updates (до архивации — в openspec/changes/); формат
  публичного API приложения до появления отдельной спеки — типы в app/packages/contracts.
  В коде app/ комментарии на английском и только о причинах; тексты интерфейса и документация —
  на русском.

  Референс реализации (копировать паттерны): UnionApp —
  /Users/aleksandrsamofalov/PycharmProjects/UnionApp/SevenElementBackend
  (JWT access 15 мин + opaque refresh с ротацией и family-revoke, argon2,
  rate-limit sliding window на Redis ZSET, антиспам по IP + cooldown по хэшу
  контакта, trusted-proxy XFF, формат ошибок {"error":{code,message,details}}).

  Инфраструктура (готова): k8s Timeweb twc-sber500, namespace backend,
  БД backend (PG user developer), Redis+Sentinel в ns ryadom-db, Langfuse в ns infra,
  образы только из cr.yandex/crpsqeamqpuvrkm5tpr9 (imagePullSecret registry-pull),
  ingress: корневой домен слышу-рядом.рф, API под path /api (без поддоменов),
  мониторинг Prometheus/Loki/Grafana в ns monitoring.

  Соглашения: комментарии и документация на русском; коммиты — по одному логическому
  изменению, без явной команды не коммитим; секреты — только через kubectl create
  secret / ~/.config/ryadom/, в git только плейсхолдеры <CHANGE_ME_*>.

# Per-artifact rules (optional)
rules:
