schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Продукт: «Слышу Рядом» — голосовой ИИ-компаньон эмоциональной поддержки (Sber500xDisrupt).
  Продукт, ограничения, глоссарий и метрики — docs/spec.md; поведение по функциям — openspec/specs/
  (по папке на capability). Аудитория 18+, 152-ФЗ, анонимный вход по устройству, «стереть всё»
  одной кнопкой, кризисный протокол перекрывает любой режим и любую метрику.

  Источник правды по поведению — код в main, а openspec/specs/ снята с него 27.10.2026. Спека
  противоречит коду — прав код, расхождение называется в отчёте и PR. Изменения поведения идут
  через change: в нём дельта к openspec/specs/, а при архивации она вливается в базу. Change живёт в ветке своей задачи; в основной ветке changes нет, только применённые спеки. Как
  работать — скилл openspec (.agents/skills/openspec/SKILL.md).

  Сервисы: агент agent/ (Python 3.12, FastAPI: диалоги, голос, кризисный протокол) и
  приложение в app/ (см. ниже).

  Приложение (каталог app/ — отдельный pnpm + Turborepo монорепозиторий на TypeScript, Node >= 24):
  - apps/web — веб-приложение за логином (Next.js 16, React 19, Tailwind 4, shadcn/ui из packages/ui);
  - apps/mobile — мобильный клиент (Framework7 + Capacitor 8 + Vite): PWA (отдельный образ nginx,
    путь /pwa/ на том же хосте, что и API), Android, iOS;
  - apps/landing — публичный сайт (Next.js): лендинг, /privacy, /terms, /download, /delete-account;
  - apps/admin — админка (Next.js): пользователи, блокировки, удаление аккаунтов, журнал действий;
  - services/api — API приложения (Hono): REST /api/*, WebSocket-шлюз к агенту /api/dialogs/ws,
    раздача OTA-сборки мобильного клиента (клиентов API не раздаёт); PostgreSQL через Drizzle (packages/db);
    Redis (необязателен) — общие для реплик счётчики лимитов запросов;
  - packages/{contracts,client-core,core,db,design,ui}; dev/agent-mock — заглушка агента для
    разработки; e2e — сквозные тесты Playwright.
  Клиенты ходят только в app/services/api, он вызывает агента по agent-api (REST + WebSocket).
  Вход в приложение — анонимный по device_id с последующей привязкой почты либо по почте
  и паролю (app/services/api, маршруты /api/*).
  Сквозная трассировка — пять заголовков (x-trace-id, x-request-time, x-client-id, x-session-id,
  x-user-id): клиенты шлют их на каждый запрос, API пишет в логи и передаёт агенту (агент их пока
  не читает).
  Формат публичного API приложения — типы в app/packages/contracts.
  Правила кода по папкам — во вложенных AGENTS.md (agent/, app/, app/packages/core/).

  Инфраструктура: k8s Timeweb twc-sber500, namespaces prod (приложение) и agent
  (агент), PostgreSQL (CNPG) и Redis+Sentinel в ns ryadom-db, Langfuse в ns infra,
  образы только из cr.yandex/crpsqeamqpuvrkm5tpr9 (imagePullSecret registry-pull),
  ingress: корневой домен слышу-рядом.рф, API под path /api (без поддоменов),
  мониторинг Prometheus/Loki/Grafana в ns monitoring.

  Соглашения: комментарии в коде app/ — на английском, в agent/ — на русском, только о причинах;
  тексты интерфейса, документация и спеки — на русском; коммиты — по одному логическому
  изменению, без явной команды не коммитим; секреты — только в Secret'ах кластера, хранятся
  локально у администратора, в git только плейсхолдеры <CHANGE_ME_*>.

# Per-artifact rules (optional)
rules:
  proposal:
    - "Первая строка — «Задача: PROTEUS-NNN», если задача есть"
    - "Таблица поверхностей: agent, api, web, pwa, android, ios, tg, admin, landing — да, нет или позже"
    - "Зависимости от других change'ей и номера миграций; что вне рамок"
    - "Для изменений интерфейса — макеты в mockups/ до кода"
  specs:
    - "Только поведение, которое видит человек или клиент, и контракты клиент ↔ API ↔ агент; без путей к файлам, классов и библиотек"
    - "У каждого требования строка «Поверхности: …»; сценарий одной поверхности начинается с неё в скобках: (PWA), (Android)"
    - "Capability — по домену продукта, не по сервису; MODIFIED несёт требование целиком со всеми сохраняемыми сценариями"
    - "Требование с именем, которое уже есть в openspec/specs, — MODIFIED (целиком, со всеми сценариями); новое — ADDED. На требования из папки другого открытого change'а MODIFIED и REMOVED не писать"
  tasks:
    - "Каждая задача атомарная и проверяемая, с реальными путями и строкой «Приёмка:»"
    - "Порядок разделов: 0 Решения → 1 Данные и контракты → 2 Агент → 3 Шлюз API → 4 Клиенты по поверхностям → 5 Проверка → 6 Выкат → 7 Архив"
    - "Раздел «Проверка» по каждому сценарию: unit/integration-тест, e2e (файл и проект desktop или mobile), скриншоты шагов сценария (390 и 1280, без видео), ручные проверки (Android, iOS, Telegram), проверки после выката"
    - "Галочка ставится только в коммите, который приносит код задачи"

operations:
  archive:
    guidance:
      - "Архивировать, только когда код в main и выкачен; папку archive/ в git не кладём: после применения дельт папку change'а удаляют, история в git. Брошенный change тоже удаляется. Флагов фич нет: выключенное в код не попадает"
      - "Перед архивацией все задачи [x] или помечены «→ <другой change>» либо «снято» с причиной, открытые вопросы закрыты, openspec validate --strict зелёный"
