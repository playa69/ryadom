schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Product: "Slyshu Ryadom" (Слышу Рядом) — a voice AI companion for emotional support (Sber500xDisrupt).
  Product spec: docs/spec.md (v2.0, SDD; replaces spec_slyshu_ryadom.pdf v1.1). Audience 18+, Russian personal data
  law 152-FZ, anonymous device-based sign-in, "erase everything" with one button; the crisis protocol overrides any
  mode and any metric.

  Language of artifacts: write proposal, design, specs and tasks in Russian, like the existing changes; keywords
  (SHALL, MUST, WHEN, THEN), delta section headers and template headings stay in English.

  Source of truth for now is the code in main: there is no openspec/specs/ yet (no change has been archived), and
  the old changes have drifted from the code. Where a spec contradicts the code, the code wins; name the mismatch in
  the report and the PR. The old client specs in add-app-client-specs and add-agent-service are outdated and are not
  requirements. Once the baseline is captured from code and archived, openspec/specs/ becomes the source of truth for
  behavior and behavior changes go only through a change. How to work — skill openspec
  (.agents/skills/openspec/SKILL.md).

  Services: the agent in agent/ (Python 3.12, FastAPI: dialogs, voice, crisis protocol) and the application in app/
  (below).

  Application (app/ — a separate pnpm + Turborepo monorepo in TypeScript, Node >= 24):
  - apps/web — the web app behind sign-in (Next.js 16, React 19, Tailwind 4, shadcn/ui from packages/ui);
  - apps/mobile — the mobile client (Framework7 + Capacitor 8 + Vite): PWA (its own nginx image, path /pwa/ on the
    same host as the API), Android, iOS;
  - apps/landing — the public site (Next.js): landing, /privacy, /terms, /download, /delete-account;
  - apps/admin — the admin panel (Next.js): users, blocking, account deletion, action log;
  - services/api — the application API (Hono): REST /api/*, the WebSocket gateway to the agent /api/dialogs/ws,
    serving the mobile client's OTA build (the API does not serve the clients); PostgreSQL via Drizzle
    (packages/db); Redis (optional) — rate-limit counters shared by replicas;
  - packages/{contracts,client-core,core,db,design,ui}; dev/agent-mock — agent mock for development; e2e —
    Playwright end-to-end tests.
  Clients talk only to app/services/api; it calls the agent over agent-api (REST + WebSocket).
  Sign-in to the app — anonymous by device_id with an email linked later, or by email and password
  (app/services/api, routes /api/*).
  End-to-end tracing — five headers (x-trace-id, x-request-time, x-client-id, x-session-id, x-user-id): clients send
  them with every request, the API logs them and passes them to the agent (the agent does not read them yet).
  The public application API format is the types in app/packages/contracts.
  Code rules per folder are in the nested AGENTS.md files (agent/, app/, app/packages/core/).

  Infrastructure: k8s Timeweb twc-sber500, namespaces prod (application) and agent (agent), PostgreSQL (CNPG) and
  Redis+Sentinel in ns ryadom-db, Langfuse in ns infra, images only from cr.yandex/crpsqeamqpuvrkm5tpr9
  (imagePullSecret registry-pull), ingress: root domain слышу-рядом.рф, API under path /api (no subdomains),
  monitoring Prometheus/Loki/Grafana in ns monitoring.

  Conventions: code comments in app/ — English, in agent/ — Russian, only about reasons; UI texts and documentation —
  Russian; one logical change per commit, no commits without an explicit request; secrets live only in Kubernetes
  Secrets and are kept locally by the administrator, git holds only <CHANGE_ME_*> placeholders.

# Per-artifact rules (optional)
rules:
  proposal:
    - "First line — «Задача: PROTEUS-NNN» when there is an issue"
    - "Surfaces table: agent, api, web, pwa, android, ios, tg, admin, landing — yes, no or later"
    - "Dependencies on other changes and migration numbers; what is out of scope"
    - "For UI changes — mockups in mockups/ before code"
  specs:
    - "Only behavior a person or a client sees and client ↔ API ↔ agent contracts; no file paths, classes or libraries"
    - "Every requirement has a «Поверхности: …» line; a scenario for one surface starts with it in brackets: (PWA), (Android)"
    - "Capability is named after the product domain, not a service; MODIFIED carries the whole requirement with every scenario that stays"
    - "While there is no openspec/specs — ADDED only; do not write MODIFIED or REMOVED against requirements in another change's folder"
  tasks:
    - "Every task is atomic and verifiable, with real paths and a «Приёмка:» line"
    - "Section order: 0 Решения → 1 Данные и контракты → 2 Агент → 3 Шлюз API → 4 Клиенты по поверхностям → 5 Проверка → 6 Выкат → 7 Архив"
    - "The «Проверка» section covers every scenario: unit/integration test, e2e (file and project desktop or mobile), screenshots of the scenario steps (390 and 1280, no video), manual checks (Android, iOS, Telegram), post-rollout checks"
    - "A task is ticked only in the commit that brings the task's code"

operations:
  archive:
    guidance:
      - "Archive only when the code is in main and rolled out; an abandoned change is deleted, not archived"
      - "Before archiving every task is [x] or marked «→ <other change>» or «снято» with a reason, open questions are closed, openspec validate --strict passes"
