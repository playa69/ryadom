    - "Задачи нарезать стандартно: каждая — атомарная, проверяемая, с критерием приёмки"
    - "Ссылки на spec.md своего change'а, docs/openapi.yaml и (для UnionApp-паттернов) прямые пути UnionApp в каждой задаче"
    - "Порядок: каркас/конфиг → модели/миграции → репозитории → сервисы → роутеры → тесты → деплой-манифесты"

