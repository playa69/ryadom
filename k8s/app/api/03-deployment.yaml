# =============================================================================
# Deployment app-api — Node API + WebSocket-шлюз + OTA-бандлы (ns prod)
# =============================================================================
# Образ app/api (app/services/api/Dockerfile; build-args VITE_PROD_* и OTA_BUILD_NUMBER —
# см. k8s/README.md, «Сборка и push образов»). PWA в образ не входит: это отдельный
# сервис app-pwa. Перед первым rollout должен завершиться Job миграций
# (db/02-job-migrate.yaml).
#
# 2 реплики (PROTEUS-254): рестарт или потеря ноды не обрывает все разговоры сразу, а выкат
# идёт по одному поду (maxUnavailable 0). Реплики разнесены по нодам мягкой anti-affinity
# (если нода одна, обе встанут на неё), PodDisruptionBudget 04-poddisruptionbudget.yaml не даёт
# drain убрать оба пода. Что делает две реплики безопасными:
#   - лимиты запросов считаются в Redis (REDIS_ENABLED=true в app-config), общие для реплик;
#   - у WebSocket-шлюза нет sticky sessions: клиент после обрыва попадает на любую реплику, а
#     «одно соединение на человека» держится через Redis (канал оповещения реплик), агент
#     к тому же пускает на диалог только одно живое соединение;
#   - часовые задачи (очистка refresh-токенов, удаление неактивных анонимных аккаунтов)
#     идемпотентны: параллельный проход второй реплики находит удалённое удалённым.
# Недоступный Redis не валит ничего: лимиты считаются в памяти пода, а оповещение между
# репликами пропадает (второе соединение человека на другой реплике сменит первое не сразу,
# а когда то оборвётся по heartbeat).
#
# Пробы — только httpGet: NetworkPolicy пускает kubelet лишь на :15020
# (istio переписывает httpGet-пробы на pilot-agent), tcpSocket на :3002 был бы
# заблокирован. readiness по /api/health: 503, пока БД недоступна и пока под
# останавливается (draining) — балансировщик снимает его с трафика.
# liveness и startup — /api/health/live: ответ процесса без БД. Рестарт не лечит упавшую базу,
# а сбрасывает все разговоры пода; при недоступной базе поды лишь уходят из ротации.
# ВАЖНО: /api/health/live есть только в образах api, собранных после PROTEUS-254. Поправить тег
# образа ниже на такой образ ДО применения манифеста: на старом образе (0.9.2) это 404, и
# startupProbe не даст новым подам стать Ready (выкат встанет, старые поды продолжат работать).
#
# readOnlyRootFilesystem + emptyDir /tmp. Если под упадёт с EROFS — это
# приложение пишет в файловую систему: найти путь в логах и добавить emptyDir.
#
# CPU limit 1000m (было 500m): шлюз перекодирует озвучку агента в Opus
# (DIALOG_AUDIO_CODECS в app-config) в отдельном worker-потоке — ≈9 мс CPU на 1 с
# речи (WASM, сложность 5), а агент шлёт кадры вдвое быстрее реального времени,
# то есть ≈2% ядра на каждый говорящий диалог в моменте, плюс сам Node. С 500m
# троттлинг CFS при десятке одновременных ответов дал бы рывки звука. request не
# меняется: в покое шлюз почти ничего не тратит.
# terminationGracePeriodSeconds 60: на SIGTERM api отвечает 503 на health,
# закрывает сокеты и завершает работу (lib/shutdown.ts).
# =============================================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-api
  namespace: prod
  labels:
    app: app-api
    app.kubernetes.io/part-of: ryadom
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: app-api
  template:
    metadata:
      labels:
        app: app-api
    spec:
      terminationGracePeriodSeconds: 60
      # Мягко: по одной реплике на ноду, но не в ущерб планированию на маленьком кластере.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: app-api
      imagePullSecrets:
        - name: registry-pull
      securityContext:
        runAsNonRoot: true
        # node:alpine → USER node (uid 1000); числовой uid нужен kubelet'у
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: cr.yandex/crpsqeamqpuvrkm5tpr9/app/api:0.9.2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3002
              protocol: TCP
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: PORT
              value: "3002"
            # DATABASE_URL собирается из несекретных DB_* (ConfigMap app-config) и
            # DB_PASSWORD (Secret). Порядок важен: $(VAR) раскрывается только для
            # переменных, объявленных ВЫШЕ в этом списке env.
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
            - name: DATABASE_URL
              value: "postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AUTH_SECRET
            - name: MOBILE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MOBILE_JWT_SECRET
            # Пароль Redis (копия redis-credentials; нужен и Sentinel'ам, и мастеру)
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_PASSWORD
            # Общий токен между сервисами (тот же AGENT_INTERNAL_TOKEN, что у агента): приложение читает его
            # из переменной AGENT_API_TOKEN; пусто = заголовок Authorization к агенту не шлётся
            - name: AGENT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AGENT_INTERNAL_TOKEN
                  optional: true
            # Личный ключ PostHog (право person:write): им api стирает профиль удалённого аккаунта.
            # Необязателен: без него аналитика работает, но профили удалённых аккаунтов остаются в PostHog
            - name: POSTHOG_PERSONAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTHOG_PERSONAL_API_KEY
                  optional: true
            # Пароль SMTP появится, когда будет провайдер почты (app-smtp, опц.); логин — SMTP_USER в app-config
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-smtp
                  key: SMTP_PASSWORD
                  optional: true
            # Токен бота Telegram Mini App (@slyshu_ryadom_bot): им api проверяет подпись данных запуска при входе
            # через Telegram. Необязателен: без ключа в app-secrets вход через Telegram выключен (NOT_CONFIGURED),
            # остальное работает как раньше
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: TELEGRAM_BOT_TOKEN
                  optional: true
          startupProbe:
            httpGet:
              path: /api/health/live
              port: 3002
            periodSeconds: 3
            failureThreshold: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3002
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 3002
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
