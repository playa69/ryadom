# =============================================================================
# PodDisruptionBudget app-api — drain ноды не убирает оба пода api сразу (ns prod)
# =============================================================================
# При 2 репликах (03-deployment.yaml) kubectl drain / обновление ноды выселяет поды api
# по одному: пока замена не станет Ready, второй под остаётся. Каждое выселение обрывает
# разговоры пода (клиенты переподключаются сами), но не все сразу.
# Касается только добровольных выселений; падение ноды PDB не останавливает.
# =============================================================================

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: app-api
  namespace: prod
  labels:
    app: app-api
    app.kubernetes.io/part-of: ryadom
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: app-api
