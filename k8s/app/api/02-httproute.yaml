# =============================================================================
# HTTPRoute app-api — /api на корневом домене (ns prod)
# =============================================================================
# Всё публикуется на ОДНОМ хосте по путям; api отвечает за префикс /api: REST,
# WebSocket-шлюз к агенту (/api/dialogs/ws), раздача OTA-бандлов (/api/ota).
# Клиентов api не раздаёт: PWA — отдельный сервис app-pwa на /pwa, веб-клиент — app-web
# на /app. PWA ходит в API на тот же origin (apiBase пустой), поэтому именно этот роут
# обслуживает и его запросы: /api хоста маршрутизирует gateway, а не nginx PWA.
#
# Приоритет совпадения (побеждает самый длинный префикс):
#   /api/*     → этот роут (Node api: /api/auth, /api/dialogs, ...)
#   /app/*     → app-web (веб-клиент)
#   /pwa/*     → app-pwa (PWA)
#   всё прочее → landing (корень)
# Цепляется к СУЩЕСТВУЮЩЕМУ listener https (корневой хост, сертификат ryadom-tls):
# новых listener'ов, сертификатов и DNS-записей не нужно. WebSocket через Istio
# Gateway работает из коробки (upgrade).
# =============================================================================

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-api
  namespace: prod
  labels:
    app.kubernetes.io/part-of: ryadom
spec:
  parentRefs:
    - name: ryadom-gateway
      namespace: istio-system
      sectionName: https
  hostnames:
    - xn----htbtgjker8b3a2c.xn--p1ai
  rules:
    - name: api
      matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: app-api
          port: 80
