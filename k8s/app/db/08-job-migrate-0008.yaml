# =============================================================================
# Job app-migrate-0008 — миграция БД app 0014 (ns prod)
#
# Что делает (образ app/migrate:0.15.0 — из packages/db/Dockerfile той же ревизии, что api 0.15.0, в нём миграции 0000…0014):
#   0014_user_reply_counts   таблица user_reply_counts — счёт принятых реплик аккаунта за сутки по Москве для целей
#                            Яндекс Метрики (одна строка на аккаунт, cascade к users); каждому неудалённому аккаунту
#                            ставится строка replies = 0 без first_reply_at: он считается уже говорившим
# После миграций тот же процесс обновляет схему очереди задач `pgboss`, если нужно. Только добавляет: прежний api (0.14.x)
# новую таблицу не замечает, миграцию можно применять заранее. Существующие таблицы не меняются.
#
# Порядок в выкате:
#   kubectl apply -f k8s/app/db/08-job-migrate-0008.yaml
#   kubectl -n prod wait --for=condition=complete job/app-migrate-0008 --timeout=240s
#   kubectl -n prod logs job/app-migrate-0008
# Проверка: в журнале ожидается «applied 1 of 15» (0014_user_reply_counts), затем «job queue schema installed or upgraded».
# Ненулевой код выхода = миграция не применена (под повторит до трёх раз). drizzle применяет только ещё не применённые.
# Откат: миграции назад не откатываются, но откат api безопасен (прежний образ таблицу не читает). Если схему всё же
# нужно вернуть: DROP TABLE user_reply_counts и запись журнала drizzle вместе с ней.
#
# Предыдущий Job (app-migrate-0007, миграция 0013) уже применён; если ещё есть:
# kubectl -n prod delete job app-migrate-0007 --ignore-not-found.
#
# sidecar.istio.io/inject=false: Job с istio-сайдкаром зависает, если сайдкар не умеет завершаться вместе с
# приложением; PG в ryadom-db вне mesh, так что сайдкар здесь ничего не даёт.
# =============================================================================
---
apiVersion: batch/v1
kind: Job
metadata:
  name: app-migrate-0008
  namespace: prod
  labels:
    app: app-migrate
    app.kubernetes.io/part-of: ryadom
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: app-migrate
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: registry-pull
      securityContext:
        runAsNonRoot: true
        # Образ node:alpine запускается как USER node (uid 1000) — числовой uid
        # нужен kubelet'у, чтобы проверить runAsNonRoot
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: cr.yandex/crpsqeamqpuvrkm5tpr9/app/migrate:0.15.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            # DATABASE_URL собирается из несекретных DB_* (ConfigMap app-config) и
            # DB_PASSWORD (Secret). Порядок важен: $(VAR) раскрывается только для
            # переменных, объявленных ВЫШЕ в этом списке env.
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
            - name: DATABASE_URL
              value: "postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
