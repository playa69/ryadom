# =============================================================================
# Job app-migrate-0005 — миграция БД app 0008_dialog_shares (ns prod)
#
# Что делает: создаёт таблицу dialog_shares (ссылки на разговор, REQ-DATA-05) с внешним ключом на users и тремя
# индексами. Только добавление: старый код приложения (api 0.7.x) таблицу не замечает, поэтому миграцию можно
# применить ДО выката api 0.8.0 и она ничего не ломает. Токена и текстов разговоров в таблице нет.
#
# Порядок в выкате:
#   kubectl apply -f k8s/app/db/05-job-migrate-0005.yaml
#   kubectl -n prod wait --for=condition=complete job/app-migrate-0005 --timeout=180s
#   kubectl -n prod logs job/app-migrate-0005
# Проверка: журнал без ошибок; в БД есть таблица dialog_shares, в drizzle.__drizzle_migrations 9 записей (0000…0008).
# Откат миграции (если понадобится): DROP TABLE dialog_shares; запись в журнале drizzle убрать вместе с ней.
#
# Образ app/migrate:0.8.0 — из packages/db/Dockerfile той же ревизии, что api 0.8.0 (в нём миграции 0000…0008).
# Он запускает `node migrate.mjs`, нужен только DATABASE_URL; ненулевой код выхода = миграция не применена.
# drizzle применяет только ещё не применённые миграции, поэтому на пустой БД этот же Job накатывает все.
#
# Для следующей миграции — копия этого файла с новым именем Job (app-migrate-0006 и т.д.) и новым тегом
# образа; предыдущий Job после применения удалить: kubectl -n prod delete job app-migrate-0005.
#
# NB: миграции разрабатываются на PG 17 (app/docker-compose.yaml), в кластере PG 16.4 — Job первым покажет,
# если что-то несовместимо.
# sidecar.istio.io/inject=false: Job с istio-сайдкаром зависает, если сайдкар не умеет завершаться вместе с
# приложением; PG в ryadom-db вне mesh, так что сайдкар здесь ничего не даёт.
# =============================================================================

---
apiVersion: batch/v1
kind: Job
metadata:
  name: app-migrate-0005
  namespace: prod
  labels:
    app: app-migrate
    app.kubernetes.io/part-of: ryadom
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: app-migrate
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: registry-pull
      securityContext:
        runAsNonRoot: true
        # Образ node:alpine запускается как USER node (uid 1000) — числовой uid
        # нужен kubelet'у, чтобы проверить runAsNonRoot
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: cr.yandex/crpsqeamqpuvrkm5tpr9/app/migrate:0.8.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            # DATABASE_URL собирается из несекретных DB_* (ConfigMap app-config) и
            # DB_PASSWORD (Secret). Порядок важен: $(VAR) раскрывается только для
            # переменных, объявленных ВЫШЕ в этом списке env.
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
            - name: DATABASE_URL
              value: "postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
