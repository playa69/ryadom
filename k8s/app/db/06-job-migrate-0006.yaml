# =============================================================================
# Job app-migrate-0006 — миграция БД app 0009_agent_voice_name (ns prod)
#
# Что делает: добавляет в users nullable-колонку agent_voice_name (выбранный голос агента, PROTEUS-182, REQ-ACC-07),
# `ALTER TABLE "users" ADD COLUMN "agent_voice_name" text;` без значения по умолчанию и без блокировки данных (метаданные
# таблицы, строки не переписываются). Только добавление: старый код приложения (api 0.8.x) колонку не замечает, поэтому
# миграцию можно применить ДО выката api 0.9.0, и она ничего не ломает.
#
# Порядок в выкате (подробнее — k8s/app/RUNBOOK-voice-selector.md):
#   kubectl apply -f k8s/app/db/06-job-migrate-0006.yaml
#   kubectl -n prod wait --for=condition=complete job/app-migrate-0006 --timeout=180s
#   kubectl -n prod logs job/app-migrate-0006
# Проверка: журнал без ошибок; в БД у users есть agent_voice_name, в drizzle.__drizzle_migrations 10 записей (0000…0009).
# Откат миграции (если понадобится): ALTER TABLE users DROP COLUMN agent_voice_name; запись в журнале drizzle убрать вместе с ней.
#
# Образ app/migrate:0.9.0 — из packages/db/Dockerfile той же ревизии, что api 0.9.0 (в нём миграции 0000…0009).
# =============================================================================

---
apiVersion: batch/v1
kind: Job
metadata:
  name: app-migrate-0006
  namespace: prod
  labels:
    app: app-migrate
    app.kubernetes.io/part-of: ryadom
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: app-migrate
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: registry-pull
      securityContext:
        runAsNonRoot: true
        # Образ node:alpine запускается как USER node (uid 1000) — числовой uid
        # нужен kubelet'у, чтобы проверить runAsNonRoot (у backend та же история)
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: cr.yandex/crpsqeamqpuvrkm5tpr9/app/migrate:0.9.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            # DATABASE_URL собирается из несекретных DB_* (ConfigMap app-config) и
            # DB_PASSWORD (Secret). Порядок важен: $(VAR) раскрывается только для
            # переменных, объявленных ВЫШЕ в этом списке env.
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
            - name: DATABASE_URL
              value: "postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
