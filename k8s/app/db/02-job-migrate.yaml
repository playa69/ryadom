# =============================================================================
# Job app-migrate-0002 — миграции drizzle БД app (ns prod)
# =============================================================================
# Образ app/migrate (app/packages/db/Dockerfile): `node migrate.mjs`, нужен
# только DATABASE_URL; ненулевой код выхода = миграция не применена. Запуск
# ПОСЛЕ create-app-db и ПЕРЕД первым rollout api/admin:
#   kubectl apply -f k8s/app/db/02-job-migrate.yaml
#   kubectl -n prod wait --for=condition=complete job/app-migrate-0002 --timeout=180s
#   kubectl -n prod logs job/app-migrate-0002
# Для новой миграции — новый Job с новым именем (app-migrate-0003 и т.д.), с
# новым тегом образа; старый удалить: kubectl -n prod delete job app-migrate-0002.
# drizzle применяет только ещё не применённые миграции. В 0.3.0 новая — 0005_agent_voice:
# колонка users.agent_voice (по умолчанию male), старый код приложения её не замечает.
#
# NB: миграции разрабатывались на PG 17 (app/docker-compose.yaml), в кластере
# PG 16.4 — этот Job первым покажет, если что-то несовместимо.
#
# sidecar.istio.io/inject=false: Job с istio-сайдкаром зависает, если сайдкар
# не умеет завершаться вместе с приложением; PG в ryadom-db всё равно вне mesh,
# так что сайдкар здесь ничего не даёт.
# =============================================================================

---
apiVersion: batch/v1
kind: Job
metadata:
  name: app-migrate-0002
  namespace: prod
  labels:
    app: app-migrate
    app.kubernetes.io/part-of: ryadom
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: app-migrate
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: registry-pull
      securityContext:
        runAsNonRoot: true
        # Образ node:alpine запускается как USER node (uid 1000) — числовой uid
        # нужен kubelet'у, чтобы проверить runAsNonRoot (у backend та же история)
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: cr.yandex/crpsqeamqpuvrkm5tpr9/app/migrate:0.3.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            # DATABASE_URL собирается из несекретных DB_* (ConfigMap app-config) и
            # DB_PASSWORD (Secret). Порядок важен: $(VAR) раскрывается только для
            # переменных, объявленных ВЫШЕ в этом списке env.
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
            - name: DATABASE_URL
              value: "postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
