# =============================================================================
# Deployment app-landing — маркетинговый сайт (Next.js standalone, ns prod)
# =============================================================================
# Образ app/landing (app/apps/landing/Dockerfile). Без БД и секретов; из env
# нужны PUBLIC_WEBAPP_URL (куда ведёт «Открыть приложение») и PUBLIC_SUPPORT_EMAIL,
# опционально PUBLIC_PWA_URL (карточка установки PWA на /download) и ссылки на
# сторы — берутся из ConfigMap app-config.
#
# Пробы и securityContext — как в api/03-deployment.yaml.
# =============================================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-landing
  namespace: prod
  labels:
    app: app-landing
    app.kubernetes.io/part-of: ryadom
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: app-landing
  template:
    metadata:
      labels:
        app: app-landing
    spec:
      imagePullSecrets:
        - name: registry-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: landing
          image: cr.yandex/crpsqeamqpuvrkm5tpr9/app/landing:0.3.5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: PORT
              value: "3000"
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 3
            failureThreshold: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/apps/landing/.next/cache
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
