# =============================================================================
# ConfigMap app-config — несекретные env сервисов из app/ (ns prod)
# =============================================================================
# Общий для api, admin, web и landing (envFrom): каждое приложение читает
# только свои ключи, лишние игнорирует. pwa (nginx) берёт ровно два ключа через
# configMapKeyRef: PUBLIC_WEB_URL и APP_ENV. ПРАВИЛО: здесь — всё статическое и
# несекретное, в Secret'ах (app-secrets, app-smtp; значения хранятся локально у
# администратора, в git их нет) — только секреты: DB_PASSWORD, AUTH_SECRET,
# MOBILE_JWT_SECRET, REDIS_PASSWORD, AGENT_INTERNAL_TOKEN, SMTP_PASSWORD и
# (необязательный) POSTHOG_PERSONAL_API_KEY.
# DATABASE_URL в Secret'ах нет: Deployment'ы собирают его из DB_* отсюда и
# DB_PASSWORD из Secret'а. Список админов — отдельный ConfigMap
# admin/00-config.yaml, только для админки (API его получать не должен).
#
# Схема адресов: ОДИН хост xn----htbtgjker8b3a2c.xn--p1ai, сервисы по путям
# (k8s/README.md, «Сервисы из app/»):
#   /          landing (маркетинг, документы)
#   /api       api: REST, WebSocket, OTA
#   /app       apps/web (клиент после входа)
#   /pwa       PWA (apps/mobile в браузере, nginx; ставится на домашний экран)
#   /admin     admin
# Адреса, оканчивающиеся на ORIGIN (без пути): PUBLIC_WEB_URL (landing, корень),
# PUBLIC_APP_URL (сервер приложения: API и OTA-бандлы — путь в нём удвоился бы),
# PUBLIC_API_URL (apps/web). Адреса с путём — только для landing: PUBLIC_WEBAPP_URL
# (куда ведут «Открыть приложение») и PUBLIC_PWA_URL (ссылка с инструкцией
# установки на странице /download).
#
# Redis (общий ryadom-db, Sentinel) используется только api и только для
# счётчиков лимитов запросов: ключи ryadom:rl:* (префикс по умолчанию), каждый
# с TTL окна. Пароль — REDIS_PASSWORD из
# Secret app-secrets (копия redis-credentials). Если
# Redis недоступен, api сам переходит на счёт в памяти (lib/redis-rate-limiter.ts).
#
# TRUSTED_PROXY_HOPS=1: перед сервисами ровно один доверенный прокси (Istio
# ingress-gateway), он ДОПИСЫВАЕТ адрес клиента в конец X-Forwarded-For. IP для
# лимитов берётся оттуда, а не из первого элемента, который пишет сам клиент.
# Появится CDN/балансировщик перед gateway — поставить 2.
#
# Чистка неактивных анонимных аккаунтов идёт всегда: раз в час api стирает
# аккаунты без почты, в которые не входили ANONYMOUS_RETENTION_DAYS (90 дней,
# contracts), вместе с данными у агента. Выключателя нет.
#
# Почта идёт через Unisender Go (EMAIL_TRANSPORT=smtp): egress на :465 открыт
# политикой prod-allow-egress-smtp-postbox, пароль — Secret app-smtp.
#
# Ключи, значение которых совпадает с умолчанием кода, ниже не повторяются: LOG_LEVEL (info),
# AGENT_TIMEOUT_MS (10000), DIALOG_OPUS_COMPLEXITY (5), DIALOG_OPUS_BITRATE (24000),
# REDIS_SENTINEL_PORT (26379), SMTP_SECURE (на порту 465 TLS включается сам).
# =============================================================================

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: prod
  labels:
    app.kubernetes.io/part-of: ryadom
data:
  # --- Общие ---
  APP_ENV: "prod"
  # --- PostgreSQL: общий сервер CNPG ryadom-db (ryadom-db-rw), но своя база и
  # своя роль (изоляция от баз agent/langfuse). Пароль — DB_PASSWORD
  # из Secret app-secrets. БД и роль создаёт Job db/01-job-create-db.yaml.
  DB_HOST: "ryadom-db-rw.ryadom-db.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "app"
  DB_USER: "app"
  # --- Публичные адреса ---
  PUBLIC_WEB_URL: "https://xn----htbtgjker8b3a2c.xn--p1ai"
  # Origin сервера приложения (БЕЗ пути): API лежит на <origin>/api, OTA-бандлы — на
  # <origin>/api/ota
  PUBLIC_APP_URL: "https://xn----htbtgjker8b3a2c.xn--p1ai"
  # apps/web: API, к которому ходит браузер (REST + WebSocket). Тот же origin, что у
  # страницы /app, поэтому CORS не нужен; он же единственный внешний origin в CSP
  # connect-src
  PUBLIC_API_URL: "https://xn----htbtgjker8b3a2c.xn--p1ai"
  # landing: куда ведут «Открыть приложение» — веб-клиент под префиксом /app
  PUBLIC_WEBAPP_URL: "https://xn----htbtgjker8b3a2c.xn--p1ai/app/"
  # landing: ссылка со страницы /download на PWA (под префиксом /pwa) и инструкции установки
  PUBLIC_PWA_URL: "https://xn----htbtgjker8b3a2c.xn--p1ai/pwa/"
  # landing: адрес поддержки (временно — личная почта владельца; заменить на
  # support@... перед публикацией)
  PUBLIC_SUPPORT_EMAIL: "totsamiynixon@yandex.ru"
  # Один доверенный прокси перед сервисами (см. шапку)
  TRUSTED_PROXY_HOPS: "1"
  # --- Почта: Unisender Go (см. шапку и README, «Почта: Unisender Go») ---
  # Домен подтверждён, DKIM `gokey` и домен ссылок `email.` настроены; SMTP_PASSWORD в Secret
  # app-smtp — ключ Unisender. Откат на Postbox описан в k8s/README.md.
  # Транспорт один: smtp (memory нужен только тестам и в кластере запрещён).
  EMAIL_TRANSPORT: "smtp"
  EMAIL_FROM: "Рядом <noreply@xn----htbtgjker8b3a2c.xn--p1ai>"
  SMTP_HOST: "smtp.go2.unisender.ru"
  SMTP_PORT: "465"
  # логин SMTP Unisender Go — идентификатор аккаунта (несекретный); секретная
  # часть — SMTP_PASSWORD в Secret app-smtp
  SMTP_USER: "8367702"
  # --- Agent (ns agent): диалоги, память, стирание данных человека ---
  # api стартует и без него (/api/health проверяет только БД), но разговоры и стирание у агента тогда не работают.
  AGENT_API_URL: "http://agent.agent.svc.cluster.local:8001"
  # --- Озвучка агента к клиентам (WS-шлюз api) ---
  # Клиент называет в hello кодеки, которые умеет декодировать, шлюз отдаёт первый из них, что есть здесь.
  # Opus ≈24 кбит/с (кодируется в worker-потоке api, ≈9 мс CPU на 1 с речи), mulaw 192 кбит/с, pcm16
  # 384 кбит/с — его получают клиенты без списка (сборки до 2026-10). Пусто = только pcm16, как раньше.
  # Лимит CPU api под Opus поднят до 1000m (api/03-deployment.yaml). Откат: убрать opus из списка и
  # перезапустить app-api — клиенты сами перейдут на mulaw.
  DIALOG_AUDIO_CODECS: "opus,mulaw,pcm16"
  # --- Redis Sentinel (см. шапку): лимиты запросов общие для реплик ---
  REDIS_SENTINEL_HOST: "redis.ryadom-db.svc.cluster.local"
  REDIS_MASTER_NAME: "mymaster"
  # (REDIS_PASSWORD — из Secret app-secrets, не из ConfigMap)
  # --- Продуктовая аналитика: PostHog, EU cloud (docs/analytics.md) ---
  # Токен проекта публичный (он только принимает события), поэтому лежит здесь, а не в Secret.
  # Пустое значение выключает аналитику целиком: /api/ingest отвечает 404, клиентам сообщается
  # «не включать». Клиенты ходят не в PostHog, а в /api/ingest этого же api (обратный прокси);
  # сам api ходит на eu.i.posthog.com и eu-assets.i.posthog.com по :443, egress из prod это разрешает.
  # Свойство app_env у событий отделяет локальные запуски с ключом от prod.
  #
  # ПРАВОВЫЕ РИСКИ (РФ), общие для всей аналитики. Это справка-исследование от 2026-10-10, а не заключение
  # юриста: нормы и суммы проверить по официальным текстам.
  #  • События с id аккаунта остаются персональными данными оператора (152-ФЗ ст. 3 п. 1, 9, ст. 13.1):
  #    «обезличенные» не значит «не ПДн», «анонимные» писать нельзя.
  #  • Облачный сервис аналитики за рубежом = трансграничная передача (ст. 3 п. 11, ст. 12): до её начала
  #    нужно уведомить Роскомнадзор (ч. 3), получить от получателя сведения (ч. 4–5) и поручить обработку по
  #    договору (ст. 6 ч. 3). Передача без уведомления — нарушение.
  #  • Клиентские события идут через наш прокси сразу в зарубежную базу и нигде в РФ не записываются:
  #    риск по ст. 18 ч. 5 (локализация; КоАП 13.11 ч. 8: 1–6 млн ₽ для юрлица).
  #  • Основание не определено: переключатель отказа не заменяет согласие (ст. 9); п. 7 и п. 9 ч. 1 ст. 6
  #    практикой для продуктовой аналитики не подтверждены. С 2025-09-01 согласие оформляется отдельно от
  #    других документов (ст. 9 ч. 1).
  #  • Данные о том, стало ли человеку легче (tension_*), с привязкой к аккаунту могут признать данными о
  #    состоянии здоровья (ст. 10: письменное согласие, повышенные штрафы).
  # Ниже над опциями — риск именно этой опции сверх перечисленного.
  #
  # POSTHOG_KEY. Включает всё перечисленное выше. Если уведомление РКН по ст. 12 ч. 3 не подано, а
  # договора с получателем нет, юридически безопаснее оставить значение пустым: пустое значение
  # останавливает любую отправку (клиентам сообщается «не включать», /api/ingest отвечает 404).
  POSTHOG_KEY: "phc_njbSH77BQ5xtbWdJVDSCKMDbKQTUtN4ByWJ8Z6fHyk5m"
  # POSTHOG_PROJECT_ID вместе с личным ключом POSTHOG_PERSONAL_API_KEY (Secret app-secrets) включает
  # стирание профиля в PostHog при удалении аккаунта («стереть всё» — обещание продукта). Риск ключа:
  # он лежит в окружении публичного api; утечка ключа с широкими правами = утечка данных аналитики
  # (ст. 19 меры защиты; КоАП 13.11 ч. 15–16, 18: оборотные штрафы, для данных ст. 10 — 10–15 млн ₽).
  # Нужен ключ с единственным правом person:write на этот проект. Пока ключа нет, api работает, а в
  # журнале стоит предупреждение; профили удалённых аккаунтов остаются в PostHog до ручной очистки.
  POSTHOG_PROJECT_ID: "300786"
  # POSTHOG_ERASE_EVENTS. Что стирать при удалении аккаунта: профиль стирается всегда.
  # РИСК "false": события удалённого аккаунта остаются под тем же id, а архив удаления в БД связывает
  # этот id с почтой и именем, то есть это ПДн, которые хранятся дольше целей (ст. 5 ч. 7) и после отзыва
  # согласия или достижения цели подлежат уничтожению в течение 30 дней (ст. 21 ч. 4–5). Взамен по
  # истории можно считать, сколько людей было (DAU, воронки, удержание). "true" стирает и события.
  POSTHOG_ERASE_EVENTS: "false"
  # Что собирают клиенты, зафиксировано в коде (app/packages/analytics/src/browser.ts), переключателей
  # здесь нет: клики, «мёртвые» и «яростные» клики, ошибки и веб-метрики — да; запись экрана, тепловые
  # карты, фича-флаги и опросы — нет. Риск каждой возможности — там же и в docs/analytics.md.
