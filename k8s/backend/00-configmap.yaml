# =============================================================================
# ConfigMap backend-config — несекретные env backend-api (ns backend)
# =============================================================================
# Источник значений: backend/.env.example (список env полностью покрывает
# config.py). Секреты (PG_PASSWORD, REDIS_PASSWORD, JWT_SECRET_KEY) здесь НЕ
# хранятся — подключаются через secretKeyRef в Deployment/Job.
# TRUSTED_PROXY_IPS — pod-CIDR кластера (Calico ippool 10.244.0.0/16,
# kubectl get ippool): XFF доверен только от подов (istio-ingressgateway).
# =============================================================================

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: backend
data:
  # --- Базовые ---
  LOCAL: "false"
  DEBUG: "false"
  # --- Приложение ---
  APP_HOST: "0.0.0.0"
  APP_PORT: "8000"
  TIMEZONE: "Europe/Moscow"
  APP_VERSION: "0.1.0"
  TRUSTED_PROXY_IPS: '["10.244.0.0/16"]'
  # --- Логирование ---
  LOG_PATH: "/app/logs"
  LOG_FILE_NAME: "app.log"
  METRIC_PATH: "/app/logs"
  METRIC_FILE_NAME: "app-metric.log"
  AUDIT_LOG_PATH: "/app/logs"
  AUDIT_LOG_FILE_NAME: "events.log"
  LOG_ROTATION: "10 MB"
  MASK_ENABLED: "true"
  # --- PostgreSQL (host/port/db/user — из secret db-credentials) ---
  PG_IS_HARD_HEALTH: "true"
  # --- Redis Sentinel (host/port/master — из secret db-credentials) ---
  REDIS_ENABLED: "true"
  REDIS_IS_HARD_HEALTH: "true"
  # --- JWT и токены (JWT_SECRET_KEY — из secret backend-secrets) ---
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "15"
  REFRESH_TOKEN_EXPIRE_DAYS: "30"
  REFRESH_TOKEN_ROTATION_GRACE_SECONDS: "10"
  PASSWORD_RESET_TOKEN_EXPIRE_MINUTES: "30"
  # --- Привязка email (6-значный код) ---
  EMAIL_LINK_CODE_TTL_SECONDS: "600"
  EMAIL_LINK_MAX_ATTEMPTS: "5"
  # --- Антиспам auth-контуров ---
  SECURITY_DEVICE_LOGIN_RATE_LIMIT: "20"
  SECURITY_DEVICE_LOGIN_RATE_LIMIT_WINDOW_SECONDS: "3600"
  SECURITY_EMAIL_LOGIN_RATE_LIMIT: "10"
  SECURITY_EMAIL_LOGIN_RATE_LIMIT_WINDOW_SECONDS: "300"
  SECURITY_EMAIL_LINK_RATE_LIMIT: "5"
  SECURITY_EMAIL_LINK_RATE_LIMIT_WINDOW_SECONDS: "3600"
  SECURITY_PASSWORD_RESET_RATE_LIMIT: "1"
  SECURITY_PASSWORD_RESET_RATE_LIMIT_WINDOW_SECONDS: "75600"
  SECURITY_PASSWORD_RESET_COOLDOWN_SECONDS: "75600"
  SECURITY_PASSWORD_RESET_CONFIRM_RATE_LIMIT: "10"
  SECURITY_PASSWORD_RESET_CONFIRM_RATE_LIMIT_WINDOW_SECONDS: "300"
