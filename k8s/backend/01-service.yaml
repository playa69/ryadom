# =============================================================================
# Service backend-api — ClusterIP перед Deployment backend-api (ns backend)
# =============================================================================
# Порт 80 → 8000 (uvicorn). Имя порта http — на него ссылаются HTTPRoute
# (backendRefs) и ServiceMonitor (scrape /metrics).
# =============================================================================

---
apiVersion: v1
kind: Service
metadata:
  name: backend-api
  namespace: backend
  labels:
    app: backend-api
spec:
  type: ClusterIP
  selector:
    app: backend-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
