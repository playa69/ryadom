# =============================================================================
# HTTPRoute backend-api — публичный API по path /api/v1 (ns backend)
# =============================================================================
# По шаблону k8s/istio/manifests/00-example-gateway.yaml. Отличие от буквы
# шаблона: match = PathPrefix /api/v1 БЕЗ префикса приложения и БЕЗ
# URLRewrite — приложение нативно отдаёт роуты под /api/v1 (см. main.py,
# include_router(prefix="/api/v1")), а служебные пути (/health, /metrics,
# /docs, /openapi.json) висят на корне и потому снаружи недоступны: gateway
# отвечает на них 404. Это единственный вариант, при котором наружу уходит
# только /api/v1/*.
#
# Роут цепляется только к listener https (sectionName) — по plain HTTP на
# :80 живёт только централизованный редирект 80→443 и ACME.
# =============================================================================

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend-api
  namespace: backend
spec:
  parentRefs:
    - name: ryadom-gateway
      namespace: istio-system
      sectionName: https
  hostnames:
    - xn----htbtgjker8b3a2c.xn--p1ai
  rules:
    # Публичный API доступен только по /api/v1/*
    # Internal/debug пути (/metrics, /health, /docs, /openapi.json) снаружи
    # не отдаём — фильтрация здесь (при появлении AuthorizationPolicy —
    # дублировать запретом и там, как в референсе).
    - name: api
      matches:
        - path:
            type: PathPrefix
            value: /api/v1
      backendRefs:
        - name: backend-api
          port: 80
