# =============================================================================
# Deployment backend-api — FastAPI backend (ns backend)
# =============================================================================
# По design.md D9: образ из зеркала YCR, imagePullSecrets registry-pull,
# несекретные env из ConfigMap backend-config, секреты — secretKeyRef
# (db-credentials + backend-secrets). Перед первым rollout должен завершиться
# Job миграций (03-job-migrate.yaml).
#
# Пробы: httpGet на :8000 (/health, /health/ready). В поде с istio-сайдкаром
# kubelet-пробы переписываются на :15020 (pilot-agent), ingress с нод
# разрешён NP kubelet-probes-allow-ingress.
#
# readOnlyRootFilesystem + emptyDir /app/logs: приложение пишет app.log,
# app-metric.log, events.log только туда (LOG_PATH/METRIC_PATH/AUDIT_LOG_PATH
# в ConfigMap).
# =============================================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: backend
  labels:
    app: backend-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      imagePullSecrets:
        - name: registry-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: cr.yandex/crpsqeamqpuvrkm5tpr9/backend/api:0.1.1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: postgres-host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: postgres-port
            - name: PG_DB
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: postgres-db-backend
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: postgres-user
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: postgres-password
            - name: REDIS_SENTINEL_HOST
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: redis-host
            - name: REDIS_SENTINEL_PORT
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: redis-sentinel-port
            - name: REDIS_MASTER_NAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: redis-master-name
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: redis-password
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: JWT_SECRET_KEY
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: logs
              mountPath: /app/logs
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: logs
          emptyDir: {}
