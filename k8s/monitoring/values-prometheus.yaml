# =============================================================================
# kube-prometheus-stack: Prometheus + Grafana + node-exporter + kube-state-metrics
#
# Установка:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm install prometheus prometheus-community/kube-prometheus-stack \
#     -n monitoring -f k8s/monitoring/values-prometheus.yaml --version 91.8.2
#
# Alertmanager включён (PROTEUS-254; до этого был выключен осознанно, 2026-10-01).
# Канал доставки пока не выбран: приёмник owner — заглушка, алерты видны только
# в UI Alertmanager (port-forward svc/prometheus-kube-prometheus-alertmanager 9093).
# Подключение канала — одна правка: блок «КАНАЛ ДОСТАВКИ» в alertmanager.config
# ниже (плюс ключ в Secret alertmanager-receiver). Правила алертов —
# monitoring/manifests/03-prometheus-rules.yaml.
#
# Образы — из зеркала cr.yandex/crpsqeamqpuvrkm5tpr9 (см. k8s/README.md
# «Реестр образов»): все registry/repository переопределены ниже,
# imagePullSecrets: registry-pull (глобально для subchart'ов + явно для
# operator и prometheusSpec).
# =============================================================================

global:
  imagePullSecrets:
    - name: registry-pull

# Managed control plane Timeweb (k0s): etcd/scheduler/controller-manager/kube-proxy
# недоступны для scrape — их ServiceMonitor'ы только плодят DOWN-таргеты.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

# Alertmanager. Перед первым helm upgrade с этим блоком (по шагам — k8s/README.md,
# «Алерты и Alertmanager»):
#   1. Образ в зеркале: тег по умолчанию у чарта —
#        helm show values prometheus-community/kube-prometheus-stack --version 91.8.2 | grep -A6 'repository: prometheus/alertmanager'
#      quay.io/prometheus/alertmanager:<тег> → cr.yandex/crpsqeamqpuvrkm5tpr9/prometheus/alertmanager:<тег>.
#   2. NetworkPolicy alertmanager-allow-egress-receivers (monitoring/manifests/01-network-policy.yaml).
#   3. Правила: monitoring/manifests/03-prometheus-rules.yaml.
alertmanager:
  enabled: true
  alertmanagerSpec:
    image:
      registry: cr.yandex
      repository: crpsqeamqpuvrkm5tpr9/prometheus/alertmanager
    imagePullSecrets:
      - name: registry-pull
    replicas: 1
    # Без PVC: состояние (тишины, журнал отправок) живёт в emptyDir и теряется при
    # перезапуске пода — после рестарта открытые алерты могут прийти повторно.
    # Ключи канала доставки лежат в Secret alertmanager-receiver (ns monitoring) и появляются
    # файлами в /etc/alertmanager/receiver/<ключ>. Secret необязателен (optional): пока канал
    # не выбран, его нет, и под стартует без него.
    volumes:
      - name: receiver-secret
        secret:
          secretName: alertmanager-receiver
          optional: true
    volumeMounts:
      - name: receiver-secret
        mountPath: /etc/alertmanager/receiver
        readOnly: true
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
  config:
    global:
      resolve_timeout: 5m
    route:
      # По умолчанию — в никуда: правила чарта (defaultRules) уровня warning/info
      # шумят на маленьком кластере. Владельцу уходят наши правила (scope=ryadom)
      # и всё critical из правил чарта (API кластера, kubelet, переполнение дисков).
      receiver: "null"
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # Watchdog горит всегда (проверка конвейера), InfoInhibitor — служебный.
        - receiver: "null"
          matchers: ['alertname =~ "Watchdog|InfoInhibitor"']
        - receiver: owner
          matchers: ['scope = "ryadom"']
        - receiver: owner
          matchers: ['severity = "critical"']
    inhibit_rules:
      # critical гасит warning/info того же алерта (как в чарте по умолчанию).
      - source_matchers: ['severity = "critical"']
        target_matchers: ['severity =~ "warning|info"']
        equal: [namespace, alertname]
      - source_matchers: ['alertname = "InfoInhibitor"']
        target_matchers: ['severity = "info"']
        equal: [namespace]
      # OOMKilled уже говорит о перезапуске того же контейнера.
      - source_matchers: ['alertname = "RyadomContainerOOMKilled"']
        target_matchers: ['alertname = "RyadomContainerRestarted"']
        equal: [namespace, pod, container]
      - source_matchers: ['alertname = "RyadomPostgresDiskAlmostFull"']
        target_matchers: ['alertname = "RyadomPostgresDiskFilling"']
        equal: [persistentvolumeclaim]
    receivers:
      - name: "null"
      - name: owner
        # ── КАНАЛ ДОСТАВКИ ─────────────────────────────────────────────────
        # Заглушка: без *_configs алерты только в UI Alertmanager. Канал (Telegram или почта) —
        # открытый вопрос владельца. Подключение: положить ключ в Secret alertmanager-receiver,
        # раскомментировать ОДИН из блоков ниже, подставить значения в <> и сделать helm upgrade.
        #
        # Telegram (бот от @BotFather, бот добавлен в чат; id чата — число, у групп со знаком минус):
        #   kubectl -n monitoring create secret generic alertmanager-receiver \
        #     --from-file=telegram-bot-token=<файл с токеном> --dry-run=client -o yaml | kubectl apply -f -
        # telegram_configs:
        #   - bot_token_file: /etc/alertmanager/receiver/telegram-bot-token
        #     chat_id: <id чата>
        #     send_resolved: true
        #
        # Почта (SMTP; пароль — ключ smtp-password в том же Secret):
        # email_configs:
        #   - to: <адрес получателя>
        #     from: <адрес отправителя>
        #     smarthost: <хост SMTP>:<порт>
        #     auth_username: <логин SMTP>
        #     auth_password_file: /etc/alertmanager/receiver/smtp-password
        #     send_resolved: true

prometheus:
  prometheusSpec:
    image:
      registry: cr.yandex
      repository: crpsqeamqpuvrkm5tpr9/prometheus/prometheus
    imagePullSecrets:
      - name: registry-pull
    # 14 дней (было 3d): расход моделей агента (agent_model_usage_total) и
    # знаменатели (диалоги, секунды речи) нужны за две недели.
    retention: 14d
    # 8GB из PVC 10Gi (было 3GB из 5Gi): остаток тома — под WAL и уплотнение блоков.
    # Потеря метрик при переполнении недопустима: упёршись в диск, Prometheus
    # перестаёт принимать данные. retentionSize срабатывает раньше retention: если
    # 14 дней не помещаются в 8GB, старые блоки удаляются раньше срока. Реальный
    # размер замерить после выката: prometheus_tsdb_storage_blocks_bytes через пару
    # дней, умноженный на 14/дни; если 14 дней не помещаются — сначала увеличить PVC
    # (класс тома умеет расширение, k8s/README.md «Хранилище»), потом retentionSize.
    # Правка размера PVC: k8s/README.md, «Алерты и Alertmanager».
    retentionSize: 8GB
    # Подбирать ВСЕ ServiceMonitor/PodMonitor/PrometheusRule/Probe в кластере
    # (не только созданные этим чартом) — паттерн референса UnionApp.
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: nvme.network-drives.csi.timeweb.cloud
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    resources:
      requests:
        cpu: 150m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    additionalScrapeConfigs:
      # Istio sidecar/proxy metrics (порт 15090, имя http-envoy-prom) во всех
      # namespace — паттерн референса. Сейчас сайдкаров нет (prod без
      # workload'ов), job безопасен и заработает сам при их появлении.
      - job_name: istio-proxy
        metrics_path: /stats/prometheus
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: http-envoy-prom
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      # CNPG PostgreSQL: инстансы ryadom-db отдают метрики на :9187
      # (тот же порт, что дёргает оператор). Ingress со стороны ryadom-db —
      # postgres/manifests/03-network-policy.yaml (monitoring:9187).
      - job_name: cnpg
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["ryadom-db"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
            action: keep
            regex: ryadom-db
          - source_labels: [__meta_kubernetes_pod_ip]
            regex: (.+)
            target_label: __address__
            replacement: ${1}:9187
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

kube-state-metrics:
  image:
    registry: cr.yandex
    repository: crpsqeamqpuvrkm5tpr9/kube-state-metrics/kube-state-metrics
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

prometheus-node-exporter:
  image:
    registry: cr.yandex
    repository: crpsqeamqpuvrkm5tpr9/prometheus/node-exporter
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

prometheusOperator:
  image:
    registry: cr.yandex
    repository: crpsqeamqpuvrkm5tpr9/prometheus-operator/prometheus-operator
  imagePullSecrets:
    - name: registry-pull
  prometheusConfigReloader:
    image:
      registry: cr.yandex
      repository: crpsqeamqpuvrkm5tpr9/prometheus-operator/prometheus-config-reloader
  admissionWebhooks:
    patch:
      # hook-job на каждом helm upgrade — тоже из зеркала
      image:
        registry: cr.yandex
        repository: crpsqeamqpuvrkm5tpr9/jkroepke/kube-webhook-certgen
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Grafana
grafana:
  enabled: true
  image:
    registry: cr.yandex
    repository: crpsqeamqpuvrkm5tpr9/grafana/grafana
  imagePullSecrets:
    - name: registry-pull
  sidecar:
    image:
      registry: cr.yandex
      repository: crpsqeamqpuvrkm5tpr9/kiwigrid/k8s-sidecar
  initChownData:
    image:
      registry: cr.yandex
      repository: crpsqeamqpuvrkm5tpr9/library/busybox
  downloadDashboardsImage:
    registry: cr.yandex
    repository: crpsqeamqpuvrkm5tpr9/curlimages/curl
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password
  # Не звонить домой (stats.grafana.org всё равно закрыт NetworkPolicy):
  # чистые логи, без warning'ов про недоступную телеметрию.
  grafana.ini:
    analytics:
      check_for_updates: false
      check_for_plugin_updates: false
      reporting:
        enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    type: pvc
    size: 2Gi
    storageClassName: nvme.network-drives.csi.timeweb.cloud
  # PVC RWO: RollingUpdate дедлокится на Multi-Attach при замене пода.
  # Recreate = ~1 минута недоступности UI при рестарте — приемлемо.
  deploymentStrategy:
    type: Recreate
    rollingUpdate: null
  # Предустановленные k8s-дашборды
  defaultDashboardsEnabled: true
  # Свои дашборды — как код: ConfigMap с label grafana_dashboard=1 подхватывается
  # sidecar'ом grafana-sc-dashboard (включён дефолтом чарта, searchNamespace: ALL).
  # Манифест: monitoring/manifests/02-dashboard-cluster-resources.yaml,
  # источник JSON: monitoring/dashboards/cluster-resources.json.
  # Loki как datasource (Prometheus — дефолтный, добавляется чартом сам)
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      isDefault: false
      editable: true
