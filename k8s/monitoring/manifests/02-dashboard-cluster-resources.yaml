        {
          "id": 50,
          "type": "row",
          "title": "Requests / Limits vs capacity нод (весь кластер, %)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 6 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 51,
          "type": "gauge",
          "title": "CPU requests / capacity",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 7, "w": 6, "x": 0, "y": 7 },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * sum(kube_pod_container_resource_requests{resource=\"cpu\"}) / sum(kube_node_status_capacity{resource=\"cpu\"})",
              "instant": true,
              "datasource": { "type": "prometheus", "uid": "prometheus" }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 60 },
                  { "color": "red", "value": 80 }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "options": {
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          }
        },
