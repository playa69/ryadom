kind: ConfigMap
metadata:
  name: cluster-resources-dashboard
  namespace: monitoring
  labels:
    # Подхватывается grafana sidecar (grafana-sc-dashboard), который следит за
    # ConfigMap с label grafana_dashboard=1 по всем namespace (searchNamespace:
    # ALL — дефолт kube-prometheus-stack). Дашборд появляется/обновляется в
    # Grafana в течение ~30s после apply и переживает пересоздание пода.
    grafana_dashboard: "1"
