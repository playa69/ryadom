# =============================================================================
# grafana/alloy — DaemonSet, собирает pod-логи со всех нод и пушит в Loki.
# Выбран вместо promtail: promtail deprecated (EOL 2026-03-02, LTS only),
# alloy — актуальный поддерживаемый сборщик от Grafana.
#
# Установка:
#   helm repo add grafana https://grafana.github.io/helm-charts
#   helm install alloy grafana/alloy \
#     -n monitoring -f k8s/monitoring/values-alloy.yaml --version 1.13.0
# =============================================================================

alloy:
  configMap:
    create: true
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
      }

      // Тейлит логи подов со своей ноды (HOSTNAME = spec.nodeName выставляет
      // чарт), позиции — в /var/lib/alloy/data (переживает рестарт пода).
      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
  # Монтировать /var/log ноды (только чтение по умолчанию чарта).
  # dockercontainers не нужен: k0s работает на containerd, логи подов —
  # в /var/log/pods.
  mounts:
    varlog: true
    dockercontainers: false
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 200m
      memory: 256Mi

# DaemonSet — по поду на ноду (дефолт чарта, зафиксировано явно)
controller:
  type: daemonset
