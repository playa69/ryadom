# =============================================================================
# ConfigMap agent-config — несекретные env сервиса agent/ (ns agent)
# =============================================================================
# Правило то же, что у app-config: здесь всё статическое и несекретное, в Secret
# `agent-secrets` — только секреты (значения хранятся локально у администратора,
# в git их нет):
#   AGENT_INTERNAL_TOKEN   общий токен между сервисами, которым api приходит к агенту; ТО ЖЕ
#                          значение лежит в app-secrets (ns prod) под таким же ключом
#   AGENT_API_TOKEN        ключ прокси программы (LiteLLM): через него работают Qwen TTS, чат-модель
#                          и распознавание речи; принадлежит только агенту, в app-secrets его нет
#   SALUTE_SPEECH_AUTH_KEY (необязательно) ключ SaluteSpeech; появится — сменить TTS_MODE на
#                          salutespeech и перезапустить агента
#   LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY (необязательно) ключи проекта Langfuse: расход моделей.
#                          Пока ключей нет, приёмник выключен. Адрес — LANGFUSE_HOST ниже, не секрет.
# Отдельный Secret `agent-gemini` (необязательный, нужен только в режиме gemini_live; создаётся
# отдельно, существующий agent-secrets не трогаем): GEMINI_API_KEY (ключ Gemini API),
# GEMINI_BASE_URL (адрес релея к Gemini API: из России Google недоступен напрямую),
# GEMINI_RELAY_TOKEN (токен релея). Адрес релея тоже в Secret'е, а не здесь: в git его нет.
# Режим озвучки TTS_MODE — не секрет, он ниже, в ConfigMap.
#
# Голос выбирает человек в профиле (мужской/женский), api передаёт его агенту при старте
# разговора. TTS_DEFAULT_VOICE — голос тех, кто ещё не выбирал.
# =============================================================================

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
  namespace: agent
  labels:
    app.kubernetes.io/part-of: ryadom
data:
  APP_PORT: "8001"
  # Озвучка: auto = SaluteSpeech (если есть ключ) → Qwen TTS → espeak-ng → без озвучки
  TTS_MODE: "qwen"                    # qwen | salutespeech
  TTS_DEFAULT_VOICE: "male"
  # Кадр звука — 200 мс; 100 мс паузы = вдвое быстрее реального времени (клиент ставит кадры в очередь)
  TTS_FRAME_INTERVAL_MS: "100"
  # Озвученные фразы живут в памяти, все фразы агента прогреваются на старте (см. agent/README.md)
  TTS_CACHE_ITEMS: "64"
  # Qwen TTS через прокси программы. Голоса (loongjohn / longanhuan_v3.6) и формат pcm
  # заданы в коде по умолчанию; других значений апстрим не принимает.
  QWEN_TTS_BASE_URL: "https://shared1.multitool.works:4000/v1"
  QWEN_TTS_MODEL: "qwen/qwen-audio-3.0-tts-flash"
  QWEN_TTS_TIMEOUT_SECONDS: "30"
  # Ответы и распознавание речи: тот же прокси и тот же ключ (AGENT_API_TOKEN), что у озвучки.
  # proxy = ответы пишет чат-модель, голос распознаёт whisper; template = без моделей (шаблоны и заглушка).
  # Модель недоступна — агент отвечает шаблоном, сервис не падает.
  LLM_MODE: "proxy"
  LLM_BASE_URL: "https://shared1.multitool.works:4000/v1"
  LLM_CHAT_MODEL: "gigachat3.5-432b-a28b"
  STT_MODEL: "whisper-large-v3"
  LLM_TIMEOUT_SECONDS: "15"
  # Голосовой конвейер. cascade = распознавание whisper → чат-модель → озвучка Qwen (боевой, всё, что выше);
  # gemini_live = речь в речь через Gemini Live (одна модель слушает, отвечает и говорит). Для gemini_live нужны
  # Secret `agent-gemini` и образ с google-genai (agent ≥ 0.2.0). Переключение: сменить значение, применить ConfigMap и
  # перезапустить агента (kubectl -n agent rollout restart deploy/agent). Откат: вернуть cascade. Подробно: README.md.
  VOICE_PIPELINE: "gemini_live"
  # Диалоги: файл SQLite на томе agent-data (03-pvc.yaml). Они переживают перезапуск и выкат пода. Не открылся файл — агент
  # работает в памяти и громко пишет в журнал (ошибка), в /health/ready видно "dialogs": "memory".
  DIALOG_DB_PATH: "/data/dialogs.sqlite3"
  # Расход моделей в Langfuse (ns infra). Включается, только когда в agent-secrets есть оба ключа.
  LANGFUSE_HOST: "http://langfuse-web.infra.svc.cluster.local:3000"
  # Память агента (docs/agent-memory-spec.md, agent/README.md «Память»): on — включена (решение владельца, 2026-10-13). Память
  # работает только у тех, кто сам включил её в профиле с согласием; MEMORY_ALLOWLIST пуст — включить может любой. Модель
  # извлечения по умолчанию — LLM_CHAT_MODEL (своя — MEMORY_LLM_MODEL), в голосовую модель уходит уровень MEMORY_BRIEF_LEVEL
  # (по умолчанию minimal). Откат функции — off (данные остаются, чтение и стирание работают). Схема файла v2 применяется при
  # старте при любом значении.
  MEMORY_MODE: "on"
  # Модель извлечения фактов — по итогам сравнения на золотом наборе (2026-10-13, scripts/memory_eval.py): GigaChat 3 Pro
  # точнее и дешевле GigaChat 3.5 (точность 1,00 против 0,85, полнота 0,92 против 0,75); модель в РФ, тот же прокси и ключ.
  MEMORY_LLM_MODEL: "gigachat-3-pro"
  # Бюджет входных токенов Gemini Live в минуту (agent/README.md, «Бюджет токенов в минуту»). У проекта Google лимит один на всех:
  # Tier 2 = 400000 токенов в минуту; сверх него Google закрывает соединение кодом 1011 «exceeded your current quota».
  # LIMIT 0 выключает учёт целиком. ENFORCE=false: агент только меряет (метрики agent_gemini_tpm_window_tokens и
  # agent_gemini_budget_level, строки журнала «gemini budget …») и после 1011 не открывает новые сессии GEMINI_QUOTA_COOLDOWN_SECONDS
  # (5 с по умолчанию, растёт до 60); поведение разговоров не меняется. ENFORCE=true включает деградацию: новые разговоры при
  # заполнении окна идут в каскад (LLM_*, STT_MODEL, TTS_MODE/QWEN_TTS_* выше), ходы ждут места и при нехватке получают шаблон.
  # Включать вторым шагом, после сравнения метрики с графиком AI Studio.
  GEMINI_TPM_LIMIT: "400000"
  GEMINI_TPM_ENFORCE: "false"
  # Ленивое открытие сессии Gemini (по audio_start или набранному сообщению, а не заранее и не сразу после ответа): экономит квоту,
  # но к первому звуку на набранный текст добавляет около секунды. Включать отдельным решением. Остальные пороги и ожидания
  # (GEMINI_TPM_TRIM_AT/ADMIT_AT/HARD_AT, GEMINI_HISTORY_MESSAGES_TIGHT, GEMINI_TPM_WAIT_MS, GEMINI_TPM_OPEN_FACTOR) не заданы:
  # значения по умолчанию из кода.
  GEMINI_LAZY_OPEN: "false"
  # Остальные настройки gemini_live (модель, голоса, сжатие контекста, возобновление сессии, размышление) намеренно не заданы:
  # действуют значения по умолчанию из кода (нейтральные: размышление и пороги сжатия решает Google). Полный список и
  # рекомендации (GEMINI_THINKING_BUDGET=0 для скорости, пороги сжатия для контроля расходов) — agent/README.md.
  # Диалоги в памяти пода (agent/README.md «Выгрузка неактивных»; образы до неё эти ключи просто не читают): человек без обращений
  # 30 минут выгружается из памяти и загружается с диска при следующем обращении (~1 мс). Потолок — страховка памяти пода (лимит 384Mi, 02-deployment.yaml):
  # человек с одним диалогом из 40 сообщений — ~29 КиБ, с двадцатью — до ~0,6 МиБ; сверх 500 человек выгружаются самые давние.
  # Живой сокет и незаписанное на диск держат человека в памяти. Без DIALOG_DB_PATH выгрузки нет.
  DIALOG_IDLE_EVICT_SECONDS: "1800"
  DIALOG_MAX_USERS_IN_MEMORY: "500"
  DIALOG_EVICT_INTERVAL_SECONDS: "60"
