# =============================================================================
# ConfigMap agent-config — несекретные env сервиса agent/ (ns agent)
# =============================================================================
# Правило то же, что у app-config: здесь всё статическое и несекретное, в Secret
# `agent-secrets` — только секреты (значения хранятся локально у администратора,
# в git их нет):
#   AGENT_INTERNAL_TOKEN   токен, которым api приходит к агенту; ТО ЖЕ значение
#                          лежит в app-secrets (ns prod) под ключом AGENT_API_TOKEN
#   QWEN_TTS_API_KEY       ключ прокси программы (LiteLLM), через который работает Qwen TTS
#   SALUTE_SPEECH_AUTH_KEY (необязательно) ключ SaluteSpeech; появится — озвучка пойдёт
#                          через Сбер, он главнее Qwen (TTS_PROVIDER=auto)
#
# Голос выбирает человек в профиле (мужской/женский), api передаёт его агенту при старте
# разговора. TTS_DEFAULT_VOICE — голос тех, кто ещё не выбирал.
# =============================================================================

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
  namespace: agent
  labels:
    app.kubernetes.io/part-of: ryadom
data:
  APP_PORT: "8001"
  # Озвучка: auto = SaluteSpeech (если есть ключ) → Qwen TTS → espeak-ng → без озвучки
  TTS_PROVIDER: "auto"
  TTS_DEFAULT_VOICE: "male"
  # Кадр звука — 200 мс; 100 мс паузы = вдвое быстрее реального времени (клиент ставит кадры в очередь)
  TTS_FRAME_INTERVAL_MS: "100"
  # Озвученные фразы живут в памяти, все фразы агента прогреваются на старте (см. agent/README.md)
  TTS_CACHE_ITEMS: "64"
  # Qwen TTS через прокси программы. Голоса (loongjohn / longanhuan_v3.6) и формат pcm
  # заданы в коде по умолчанию; других значений апстрим не принимает.
  QWEN_TTS_BASE_URL: "https://shared1.multitool.works:4000/v1"
  QWEN_TTS_MODEL: "qwen/qwen-audio-3.0-tts-flash"
  QWEN_TTS_TIMEOUT_SECONDS: "30"
