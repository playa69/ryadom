# =============================================================================
# ConfigMap agent-config — несекретные env сервиса agent/ (ns agent)
# =============================================================================
# Правило то же, что у app-config: здесь всё статическое и несекретное, в Secret
# `agent-secrets` — только секреты (значения хранятся локально у администратора,
# в git их нет):
#   AGENT_INTERNAL_TOKEN   общий токен между сервисами, которым api приходит к агенту; ТО ЖЕ
#                          значение лежит в app-secrets (ns prod) под таким же ключом
#   AGENT_API_TOKEN        ключ прокси программы (LiteLLM) для фоновой модели: итоги разговоров и недели, заметки памяти;
#                          принадлежит только агенту, в app-secrets его нет
#   LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY   ключи проекта ryadom в self-hosted Langfuse (pk-lf…/sk-lf…; создаются в UI
#                          Langfuse). Заданы оба — трейсинг включён, нет ни одного — выключен. Адрес — в коде, не секрет.
# Отдельный Secret `agent-gemini` (обязательный: без него агент не стартует; создаётся отдельно, существующий agent-secrets не
# трогаем): GEMINI_API_KEY (ключ Gemini API), GEMINI_BASE_URL (адрес релея к Gemini API: из России Google недоступен напрямую),
# GEMINI_RELAY_TOKEN (токен релея). Адрес релея тоже в Secret'е, а не здесь: в git его нет.
#
# Голос — только Gemini Live: переключателя режимов нет. Голос выбирает человек в профиле (мужской/женский или голос Gemini по
# имени), api передаёт его агенту при старте разговора; голос тех, кто ещё не выбирал, — TTS_DEFAULT_VOICE (в коде male).
#
# Ключи, значения которых совпадают с умолчанием в коде (agent/app/core/config.py), здесь не повторяются: ключ добавляют, только
# когда значение должно отличаться от кода. Полный список переменных — agent/.env.example и agent/README.md.
# =============================================================================

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
  namespace: agent
  labels:
    app.kubernetes.io/part-of: ryadom
data:
  APP_PORT: "8001"
  # Версия агента: отдаёт GET /version и ставится тегом в трассы Langfuse. Держать равной тегу образа (02-deployment.yaml).
  APP_VERSION: "0.8.8"
  # Фоновая модель (итоги разговоров и недели, заметки памяти): текстовая модель того же прокси программы, что раньше вела
  # ответы. Ключ — AGENT_API_TOKEN из agent-secrets. Модель (LLM_CHAT_MODEL gigachat3.5-432b-a28b) и таймаут (LLM_TIMEOUT_SECONDS 15)
  # заданы в коде. Модель недоступна — итог не подводится (его можно завести вручную), разговор идёт как обычно.
  LLM_BASE_URL: "https://shared1.multitool.works:4000/v1"
  # Пауза между словами фиксированных фраз (кризисный ответ, просьба повторить): не растягиваем их на секунды.
  STREAM_DELAY_MS: "10"
  # Трейсинг LLM-ходов в self-hosted Langfuse (ns infra) включается ключами проекта в Secret `agent-secrets` (см. шапку): трасса на
  # ход диалога (расшифровка → ответ, токены Gemini, задержки этапов), сессия = диалог. Тексты реплик в Langfuse НЕ уходят никогда
  # (решение владельца 2026-10-13): вместо них число символов и слов, длительность речи, токены и задержки. Откат: убрать ключи
  # из Secret и перезапустить агента. Адрес Langfuse в коде: http://langfuse-web.infra.svc.cluster.local:3000.
  #
  # Диалоги: PostgreSQL, база `agent` в CNPG ryadom-db (app/services/dialog_db.py). DSN с паролем — в Secret
  # `agent-db` (ключ DIALOG_DATABASE_URL, подключается в 02-deployment.yaml), схему агент создаёт сам при старте.
  # Не удалось подключиться — агент работает в памяти и громко пишет в журнал (ошибка), в /health/ready видно
  # "dialogs": "memory". SQLite в агенте больше нет: откат — прежний образ (0.6.x) с его DIALOG_DB_PATH, но диалоги,
  # записанные в PostgreSQL, старый образ не увидит.
  #
  # Память агента — Cognee (app/memory/cognee_backend.py, PR #53): согласие и данные человека — его датасет в Cognee
  # (svc cognee, тот же ns agent; деплой — 12-cognee-deployment.yaml). Сервисный пользователь — Secret
  # cognee-service-account (ключи COGNEE_SERVICE_EMAIL/COGNEE_SERVICE_PASSWORD, подключены в 02-deployment.yaml).
  # Память = два слоя (openspec/changes/add-memory-notes): заметки о человеке в PostgreSQL агента (`memory_notes`) и поиск по
  # прошлым разговорам в Cognee. Включена ли память у человека и согласие хранятся в базе агента (`memory_settings`), а не
  # здесь: пауза переживает перезапуск. Согласия и факты SQLite-памяти (образы < 0.8.0) не мигрировали (решение владельца).
  # Заметки извлекаются по ходу разговора всегда (при включённой памяти у человека и заданном ключе прокси); лимит живых заметок
  # (MEMORY_NOTES_MAX 200) и размер блока памяти (MEMORY_BRIEF_MAX_TOKENS 1200) заданы в коде.
  COGNEE_BASE_URL: "http://cognee:8000"
  # Учёт входных токенов Gemini Live в минуту (agent/README.md, «Учёт токенов в минуту»). У проекта Google лимит один на всех:
  # Tier 2 = 400000 токенов в минуту; сверх него Google закрывает соединение кодом 1011 «exceeded your current quota». Агент
  # только меряет окно (метрики agent_gemini_tpm_window_tokens и agent_gemini_tpm_limit_tokens, сравнивать с графиком AI Studio)
  # и после 1011 не открывает новые сессии GEMINI_QUOTA_COOLDOWN_SECONDS (5 с по умолчанию, растёт до 60); новые разговоры не
  # отсекаются, ходы не получают отказ. 0 выключает учёт целиком.
  GEMINI_TPM_LIMIT: "400000"
  # Как часто менять сессию Gemini (agent/README.md, «Как часто менять сессию»): GEMINI_ROTATE_EVERY=4 в коде, раз в 4 хода на ход
  # выходит ≈0,7K токенов TPM вместо ≈1,95K при смене каждый ход, а входных токенов (оплата) больше на треть. «1» — смена после
  # каждого ответа. GEMINI_ROTATE_AUDIO_TOKENS (1500) меняет сессию раньше, когда накопилось много аудио.
  # Возврат памяти системе (agent/README.md, «Память процесса»): раз в столько секунд сборка мусора и malloc_trim. Без него RSS после
  # нагрузки остаётся на пике (в нагрузочном тесте 79 → 330 МиБ при лимите 384Mi) и не опускается. В коде по умолчанию 60; здесь 30:
  # на стенде после 150 человек RSS 160 МиБ против 286 при 60 с, цена прохода в покое — единицы миллисекунд. 0 = выключено.
  MEMORY_RECLAIM_SECONDS: "30"
  # Остальные настройки Gemini Live (модель, голоса, сжатие контекста, размышление, пороги) намеренно не заданы: действуют
  # значения по умолчанию из кода (нейтральные: размышление и пороги сжатия решает Google). Список и рекомендации
  # (GEMINI_THINKING_BUDGET=0 для скорости, пороги сжатия для контроля расходов) — agent/README.md.
  # Диалоги в памяти пода (agent/README.md «Выгрузка неактивных»): человек без обращений 30 минут (DIALOG_IDLE_EVICT_SECONDS 1800
  # в коде) выгружается из памяти и загружается с диска при следующем обращении (~1 мс). Потолок — страховка памяти пода (лимит
  # 384Mi, 02-deployment.yaml): человек с одним диалогом из 40 сообщений — ~29 КиБ, с двадцатью — до ~0,6 МиБ; сверх 500 человек
  # выгружаются самые давние. Живой сокет и незаписанное в базу держат человека в памяти. Без DIALOG_DATABASE_URL выгрузки нет.
  DIALOG_MAX_USERS_IN_MEMORY: "500"
  # Срок хранения разговоров (add-mood-diary, D14; agent/README.md): через 21 день после последнего сообщения (DIALOG_RETENTION_DAYS
  # в коде) разговор с итогом помечается удалённым, проход раз в час; физически помеченное убирает очистка
  # (app/services/dialog_purge.py, PROTEUS-255). Сухого прогона нет: срок хранения работает по-настоящему. Итог разговора:
  # модель ждём RECAP_TIMEOUT_SECONDS=20 (в коде).
