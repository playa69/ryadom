# =============================================================================
# PVC agent-data — диск агента: диалоги переживают перезапуск и выкат пода (ns agent)
# =============================================================================
# Агент хранит диалоги в памяти и дублирует их в файл SQLite /data/dialogs.sqlite3 (DIALOG_DB_PATH в agent-config,
# agent/app/services/dialog_db.py). Без диска каждый выкат стирал бы все разговоры. Применять ДО Deployment'а:
#   kubectl apply -f k8s/agent/03-pvc.yaml
#
# Класс по умолчанию — сетевые диски Timeweb (k8s/README.md «Хранилище»): WaitForFirstConsumer, то есть диск создаётся
# при первом запуске пода с этим PVC. Размер 5Gi — наименьший, который уже работает в кластере (Redis, Loki); диалогов
# на годы хватит с огромным запасом (одно сообщение — сотни байт).
#
# ВАЖНО: reclaimPolicy класса — Delete. `kubectl delete pvc agent-data` (и удаление namespace) удаляет сетевой диск
# вместе со ВСЕМИ диалогами без возможности вернуть. Бэкапов у этого диска нет: резервная копия — отдельная задача
# (например, периодический `sqlite3 .backup` в объектное хранилище) или переезд на PostgreSQL агента (design D6).
# Откат на образ без поддержки диска безопасен: файл остаётся лежать нетронутым.
# =============================================================================

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-data
  namespace: agent
  labels:
    app: agent
    app.kubernetes.io/part-of: ryadom
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nvme.network-drives.csi.timeweb.cloud
  resources:
    requests:
      storage: 5Gi
