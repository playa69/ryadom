# =============================================================================
# Deployment agent — агент «Слышу Рядом»: голос Gemini Live, диалоги в PostgreSQL, память (ns agent)
# =============================================================================
# Образ cr.yandex/crpsqeamqpuvrkm5tpr9/agent/agent:<тег> (agent/Dockerfile; сборка и push —
# k8s/agent/README.md). Тег в манифесте должен совпадать с отправленным; latest не используем.
#
# РОВНО 1 РЕПЛИКА и strategy Recreate: рабочий набор диалогов живёт в памяти процесса (в БД он дублируется
# в фоне), поэтому вторая реплика не увидит чужие диалоги (404), а Recreate оставляет одного писателя в хранилище.
# Хранилище диалогов — PostgreSQL (база agent в CNPG ryadom-db, DIALOG_DATABASE_URL из Secret agent-db);
# SQLite и PVC agent-data больше нет (с 0.8.0, решение владельца — без миграции старых диалогов).
#
# Пробы — только httpGet (NetworkPolicy пускает kubelet на :15020, istio переписывает пробы
# на pilot-agent; tcpSocket был бы заблокирован). /health отвечает всегда, пока жив процесс.
# readOnlyRootFilesystem + emptyDir /tmp: запас на временные файлы (проверено: агент с этими
# ограничениями отвечает и озвучивает; если под упадёт с EROFS — найти путь в логах).
# Секреты — из Secret agent-secrets (создаётся командой `kubectl create secret`, не из git).
# terminationGracePeriodSeconds 30: на SIGTERM агент закрывает сокеты кодом 1012 (restart).
# =============================================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: agent
  labels:
    app: agent
    app.kubernetes.io/part-of: ryadom
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: registry-pull
      securityContext:
        runAsNonRoot: true
        # agent/Dockerfile: useradd --uid 10001; числовой uid нужен kubelet'у
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: cr.yandex/crpsqeamqpuvrkm5tpr9/agent/agent:0.8.8
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: agent-config
          env:
            - name: AGENT_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: AGENT_INTERNAL_TOKEN
            # Ключ прокси программы для фоновой модели (итоги разговоров и недели, заметки памяти); принадлежит только агенту,
            # не общий токен между сервисами
            - name: AGENT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: AGENT_API_TOKEN
            # Голос агента — Gemini Live: Secret agent-gemini обязателен (создаётся отдельно). Нет Secret'а или ключа в нём — под не
            # запускается (CreateContainerConfigError), а без GEMINI_API_KEY сервис не стартует (fail-fast). Адрес релея и его
            # токен лежат в Secret'е, в git их нет.
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-gemini
                  key: GEMINI_API_KEY
            - name: GEMINI_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: agent-gemini
                  key: GEMINI_BASE_URL
            - name: GEMINI_RELAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-gemini
                  key: GEMINI_RELAY_TOKEN
            # DSN PostgreSQL диалогов (база agent в CNPG ryadom-db). Secret agent-db: kubectl create secret generic agent-db \
            #   --from-literal=DIALOG_DATABASE_URL="postgresql://agent:<пароль agent-db-credentials>@ryadom-db-rw.ryadom-db:5432/agent"
            - name: DIALOG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agent-db
                  key: DIALOG_DATABASE_URL
            # Сервисный пользователь Cognee (память агента, COGNEE_BASE_URL в ConfigMap): логин агента в Cognee API,
            # датасеты пользователей создаются от него. Secret уже существует (деплой Cognee, README «Cognee»).
            - name: COGNEE_SERVICE_EMAIL
              valueFrom:
                secretKeyRef:
                  name: cognee-service-account
                  key: COGNEE_SERVICE_EMAIL
            - name: COGNEE_SERVICE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cognee-service-account
                  key: COGNEE_SERVICE_PASSWORD
            # Ключи проекта ryadom в Langfuse: заданы оба — трейсинг включён, нет ни одного — выключен (один без второго —
            # сервис не стартует, fail-fast). optional: без ключей агент стартует и работает без трейсинга.
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: LANGFUSE_PUBLIC_KEY
                  optional: true
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: LANGFUSE_SECRET_KEY
                  optional: true
          startupProbe:
            httpGet:
              path: /health
              port: 8001
            periodSeconds: 3
            failureThreshold: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8001
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            periodSeconds: 20
            # Под нагрузкой цикл событий агента занят секундами: короткий таймаут перезапускал бы под вместе со всеми разговорами.
            timeoutSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            # Нагрузочный тест 13.10: ~0,1 CPU-с на ход, при лимите 500m агент упирался в троттлинг (до 60%) и на 7 минут выпал из
            # проб готовности; память росла до 330 МиБ (лимит 384Mi), пик при одновременных разговорах ~3 МиБ на разговор.
            # Запрос выше прежних 50m: планировщик не должен считать агента почти бесплатным (узел с агентом в тесте был занят на 79–94%).
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi
      volumes:
        - name: tmp
          emptyDir: {}
