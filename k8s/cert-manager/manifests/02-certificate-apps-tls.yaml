# =============================================================================
# Certificate: ryadom-apps-tls — TLS для поддоменов app./web./admin.
# =============================================================================
# Отдельный сертификат ТОЛЬКО под поддомены сервисов из app/ (решение
# 2026-10-05: app. — api+PWA, web. — веб-клиент, admin. — админка). Сознательно
# НЕ расширяем dnsNames существующего ryadom-tls (корневой домен): если выпуск
# поддоменов упадёт (нет DNS-записи, лимиты Let's Encrypt), корневой
# сертификат, которым пользуется Python backend, остаётся нетронутым.
#
# Secret ryadom-apps-tls создаётся cert-manager'ом в istio-system — там же, где
# и ryadom-tls (namespace gateway-workload); на него ссылаются listener'ы
# https-app / https-web / https-admin Gateway ryadom-gateway
# (k8s/istio/manifests/01-gateway-api-gateway.yaml).
#
# Выпуск: HTTP-01 через ClusterIssuer letsencrypt-prod (solver gatewayHTTPRoute
# цепляется к listener :80 без hostname). Wildcard HTTP-01 не выпускает, поэтому
# имена перечислены явно.
#
# ПОРЯДОК (важно): сначала A-записи app./web./admin. → 185.207.64.68 в
# Yandex Cloud DNS (зона slyshu-ryadom), проверить `nslookup`, и только потом
# применять этот манифест. Дождаться:
#   kubectl -n istio-system wait --for=condition=ready certificate/ryadom-apps-tls --timeout=300s
# и только ПОСЛЕ этого применять правку Gateway (listener'ы ссылаются на секрет).
# =============================================================================

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ryadom-apps-tls
  namespace: istio-system
spec:
  secretName: ryadom-apps-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - app.xn----htbtgjker8b3a2c.xn--p1ai
    - web.xn----htbtgjker8b3a2c.xn--p1ai
    - admin.xn----htbtgjker8b3a2c.xn--p1ai
