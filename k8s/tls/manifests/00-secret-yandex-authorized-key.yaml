# =============================================================================
# ШАБЛОН: authorized key сервисного аккаунта для lego DNS-01 (Yandex Cloud DNS)
# =============================================================================
# НЕ КОММИТИТЬ реальное значение. SA с ролью dns.editor на folder с DNS-зоной;
# authorized key создаётся один раз:
#
#   yc iam key create --service-account-name <CHANGE_ME_SA_NAME> \
#     --output authorized-key.json
#
# Способы заполнения:
#
# 1. Напрямую через kubectl (рекомендуется, в git не попадает):
#
#      kubectl -n infra create secret generic yandex-authorized-key \
#        --from-file=key=authorized-key.json && rm authorized-key.json
#
# 2. Через этот шаблон: base64 от JSON-файла (см. k8s/prepare-secrets.sh,
#    блок YANDEX_AUTHORIZED_KEY), применить локально и откатить.
#
# Использование — k8s/tls/TLS-RUNBOOK.md (YANDEX_CLOUD_IAM_TOKEN для lego).
# NB: в референсе секрет лежит в ns cert-manager (исторически); здесь — infra,
# отдельный namespace ради одного секрета не создаём.
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: yandex-authorized-key
  namespace: infra
type: Opaque
data:
  # base64(authorized-key.json)
  key: <CHANGE_ME_BASE64>
