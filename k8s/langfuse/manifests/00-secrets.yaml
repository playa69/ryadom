# =============================================================================
# ШАБЛОНЫ секретов Langfuse (namespace infra) — НЕ КОММИТИТЬ реальные значения
# =============================================================================
# Заполнение — k8s/prepare-secrets.sh (блок LANGFUSE: пароли спросит,
# SALT/NEXTAUTH_SECRET/ENCRYPTION_KEY сгенерирует через openssl) или
# напрямую через kubectl create secret (значения — из менеджера секретов).
#
# NB: langfuse-db-credentials нужен в ДВУХ namespace:
#   - infra     — читает helm-релиз langfuse (values-langfuse.yaml)
#   - ryadom-db — читает Job 01-job-create-db.yaml (создаёт роль/базу)
# Держать значения синхронными при смене пароля.
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: langfuse-db-credentials
  namespace: infra
type: Opaque
data:
  # base64("langfuse")
  username: bGFuZ2Z1c2U=
  password: <CHANGE_ME_BASE64>
---
# Копия для Job create-db (см. шапку). Те же значения.
apiVersion: v1
kind: Secret
metadata:
  name: langfuse-db-credentials
  namespace: ryadom-db
  labels:
    # маркер, что это копия секрета из ns infra
    secret-copy-of: infra/langfuse-db-credentials
type: Opaque
data:
  username: bGFuZ2Z1c2U=
  password: <CHANGE_ME_BASE64>
---
apiVersion: v1
kind: Secret
metadata:
  name: langfuse-clickhouse-credentials
  namespace: infra
type: Opaque
data:
  password: <CHANGE_ME_BASE64>
---
apiVersion: v1
kind: Secret
metadata:
  name: langfuse-core-secrets
  namespace: infra
type: Opaque
data:
  # SALT=$(openssl rand -base64 32)
  SALT: <CHANGE_ME_BASE64>
  # ENCRYPTION_KEY=$(openssl rand -hex 32)  — 64 hex-символа
  ENCRYPTION_KEY: <CHANGE_ME_BASE64>
  # NEXTAUTH_SECRET=$(openssl rand -base64 32)
  NEXTAUTH_SECRET: <CHANGE_ME_BASE64>
---
apiVersion: v1
kind: Secret
metadata:
  name: langfuse-s3-credentials
  namespace: infra
type: Opaque
data:
  # Статические ключи SA с storage.editor (тот же bucket, что CNPG backups,
  # префиксы langfuse/*)
  S3_ACCESS_KEY_ID: <CHANGE_ME_BASE64>
  S3_SECRET_ACCESS_KEY: <CHANGE_ME_BASE64>
---
apiVersion: v1
kind: Secret
metadata:
  name: langfuse-redis-credentials
  namespace: infra
type: Opaque
data:
  REDIS_PASSWORD: <CHANGE_ME_BASE64>
