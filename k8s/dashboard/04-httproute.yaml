# Наружу — только /dashboard и /dashboard/api; /healthz сервиса снаружи не виден.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dashboard
  namespace: dashboard
  labels:
    app.kubernetes.io/part-of: ryadom
spec:
  parentRefs:
    - name: ryadom-gateway
      namespace: istio-system
      sectionName: https
  hostnames:
    - xn----htbtgjker8b3a2c.xn--p1ai
  rules:
    - name: dashboard
      matches:
        - path:
            type: PathPrefix
            value: /dashboard
      backendRefs:
        - name: dashboard
          port: 8080
