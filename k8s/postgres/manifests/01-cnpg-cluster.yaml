# =============================================================================
# CNPG Cluster: ryadom-db (namespace ryadom-db) — PostgreSQL 16, HA из 2 инстансов
# =============================================================================
# Требует установленного CloudNativePG operator:
#   helm repo add cnpg https://cloudnative-pg.github.io/charts
#   helm install cnpg cnpg/cloudnative-pg \
#     --namespace cnpg-system --create-namespace
#
# instances=2 — primary + 1 реплика (ноды Timeweb 2 vCPU / 4 ГБ: третий
# инстанс не влезает по ресурсам). enablePodAntiAffinity разносит инстансы
# по нодам (встроенный механизм CNPG по kubernetes.io/hostname — как в
# референсе UnionApp/k8s/langfuse/manifests/02-cnpg-cluster.yaml).
#
# Ресурсы (PROTEUS-254): requests 250m / 768Mi, limits 1 vCPU / 1Gi (были 100m / 256Mi и
# 500m / 512Mi) — запас под рост нагрузки: в базе живут app, agent, cognee и langfuse.
# shared_buffers 256MB — четверть лимита памяти, остальное — backend'ы (до 100 соединений)
# и page cache. Нода 2 vCPU / 4 ГБ несёт ещё Redis, istio-сайдкары и мониторинг: CNPG
# получает долю, не ноду целиком. Дальше поднимать вместе с лимитом памяти (shared_buffers
# держать около четверти) и после замера: kubectl -n ryadom-db top pod.
#
# Том: одна PVC на инстанс держит и данные, и WAL (walStorage не вынесен: перенос WAL
# на отдельный том требует пересоздания кластера). Поэтому полный том = остановка записи, а сбой
# архивации WAL в S3 копит журнал прямо на нём: на то и алерты RyadomPostgresDisk*
# (monitoring/manifests/03-prometheus-rules.yaml).
#
# РАСШИРЕНИЕ ТОМА (размер только растёт, уменьшить нельзя):
#   1. StorageClass nvme.network-drives.csi.timeweb.cloud — allowVolumeExpansion: true
#      (k8s/README.md, «Хранилище»); проверка:
#        kubectl get sc nvme.network-drives.csi.timeweb.cloud -o jsonpath='{.allowVolumeExpansion}'
#   2. Поменять spec.storage.size ниже и применить манифест:
#        kubectl apply -f k8s/postgres/manifests/01-cnpg-cluster.yaml
#      Оператор сам увеличит PVC всех инстансов (storage.resizeInUseVolumes: true по умолчанию),
#      пересоздавать поды не нужно.
#   3. Следить: kubectl -n ryadom-db get pvc -w — ёмкость растёт до нового размера. Если PVC
#      застрял в FileSystemResizePending, файловая система дорастёт после перезапуска пода:
#      сначала реплики (kubectl -n ryadom-db delete pod ryadom-db-<N> у не-primary), затем
#      switchover и тот же шаг для бывшего primary.
#   4. Проверка: kubectl -n ryadom-db exec ryadom-db-1 -c postgres -- df -h /var/lib/postgresql/data
# =============================================================================

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ryadom-db
  namespace: ryadom-db
spec:
  instances: 2
  # Образ из зеркала cr.yandex (см. k8s/README.md «Реестр образов»).
  # Смена imageName → rolling-пересоздание инстансов (реплики первыми,
  # switchover primary — автоматически, кластер остаётся healthy).
  imageName: cr.yandex/crpsqeamqpuvrkm5tpr9/cloudnative-pg/postgresql:16.4
  imagePullSecrets:
    - name: registry-pull

  storage:
    # 30Gi (было 10Gi): на одном томе общая база app, agent, cognee (векторы) и langfuse, там же WAL.
    size: 30Gi
    # Сетевой диск Timeweb через CSI. Кластер в регионе Москва — HDD там
    # недоступен (проверено: CreateVolume "disk preset not found"),
    # поэтому NVMe. В СПб можно hdd.network-drives.csi.timeweb.cloud.
    storageClass: nvme.network-drives.csi.timeweb.cloud

  # Multi-node cluster (3 nodes): spread instances across nodes, по инстансу
  # на ноду
  affinity:
    enablePodAntiAffinity: true

  # Суперпользователь postgres для админ-задач (Job create-db для langfuse
  # и будущих сервисов) — паттерн референса (sevenelement-db). Без
  # superuserSecret CNPG отключает доступ postgres. Секрет — шаблон в
  # 00-secrets.yaml, реальное значение в git не коммитим.
  superuserSecret:
    name: ryadom-db-superuser

  # Декларативные роли (CNPG managed roles, с 1.20+). developer — общий
  # логин коллег-разработчиков (SA developer, ns agent): LOGIN + CREATEDB,
  # БЕЗ superuser/createrole. Создавал базу agent (владелец теперь — роль
  # agent, k8s/agent/db/01-job-create-role.yaml).
  # Пароль — Secret developer-pg-role (key: password), создаётся через
  # kubectl create secret (шаблон в 00-secrets.yaml), в git НЕ коммитим.
  managed:
    roles:
      - name: developer
        login: true
        createdb: true
        passwordSecret:
          name: developer-pg-role

  resources:
    requests:
      memory: "768Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  bootstrap:
    initdb:
      database: ryadom
      owner: ryadom
      secret:
        name: ryadom-db-credentials

  # Continuous backup: WAL archiving + base backups → Yandex Object Storage
  # (barman-cloud). Bucket ryadom-cnpg-backups (создан заранее в YC).
  # Credentials — Secret cnpg-backup-s3-credentials (см. 00-secrets.yaml,
  # реальные значения НЕ храним в git), команда создания — там же.
  # NB: native barmanObjectStore deprecated, будет удалён в CNPG 1.31 — при
  # апгрейде оператора мигрировать на Barman Cloud Plugin.
  #
  # Префикс .../ryadom-db-twc: под .../ryadom-db лежат WAL/base backups
  # YC-установки того же кластера (2026-10-01) — barman-cloud-check-wal-archive
  # требует пустой архив для первого WAL нового кластера ("Expected empty
  # archive"), поэтому Timeweb-установка пишет в соседний префикс, старые
  # объекты не удалялись.
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://ryadom-cnpg-backups/cnpg-backups/ryadom-db-twc
      endpointURL: https://storage.yandexcloud.net
      s3Credentials:
        accessKeyId:
          name: cnpg-backup-s3-credentials
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-backup-s3-credentials
          key: AWS_SECRET_ACCESS_KEY
      wal:
        compression: gzip
      data:
        compression: gzip

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
      effective_cache_size: "512MB"
      maintenance_work_mem: "64MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "4096kB"
      default_statistics_target: "100"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      work_mem: "1MB"
      min_wal_size: "512MB"
      max_wal_size: "1GB"
