# =============================================================================
# Network Policy для CNPG PostgreSQL ryadom-db (namespace ryadom-db)
# =============================================================================
# Дополняет базовые политики namespace (namespaces/manifests/03-network-policy-
# ryadom-db.yaml): ingress-правила для CNPG. Обратная сторона — egress-правило
# prod → ryadom-db:5432 в namespaces/manifests/01-network-policy-prod.yaml.
# =============================================================================

# Входящий трафик в CNPG PostgreSQL ryadom-db (cnpg.io/cluster=ryadom-db):
#   - приложения из ns prod (5432)
#   - приложения из ns backend (5432) — backend-api (k8s/backend/)
#   - сервисы из ns infra, в т.ч. Langfuse web/worker (5432)
#   - репликация между инстансами внутри namespace (5432)
#   - cnpg-system operator: управление (5432), status (8000), metrics (9187)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ryadom-db-allow-ingress
  namespace: ryadom-db
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: ryadom-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prod
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: backend
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra
        # Replication между инстансами CNPG внутри namespace
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 5432
    # CNPG operator: status (8000) и metrics (9187)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 9187
    # Prometheus (ns monitoring): scrape metrics инстансов :9187
    # (job cnpg в monitoring/values-prometheus.yaml; обратная сторона —
    # egress-правило prometheus в monitoring/manifests/01-network-policy.yaml)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9187
    # Межинстансовые проверки CNPG (failsafe/liveness :8000) внутри namespace.
    # Правило добавлено после включения Calico: референс его не содержал
    # (там NP не исполнялись), без него инстансы не достукиваются друг до
    # друга по :8000 — "instance connectivity error" в логах.
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
