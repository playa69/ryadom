# =============================================================================
# ШАБЛОН секретов PostgreSQL (namespace ryadom-db) — НЕ КОММИТИТЬ реальные значения
# =============================================================================
# Здесь ТОЛЬКО плейсхолдеры. Два рабочих способа заполнения:
#
# 1. Сгенерировать base64 через k8s/prepare-secrets.sh, подставить значения,
#    применить файл локально и НЕ коммитить (паттерн референсного репо:
#    секреты либо вообще не хранятся в git, либо файл заполняется перед apply).
#
# 2. Создать секреты напрямую через kubectl (рекомендуется, как в референсе —
#    реальные значения берутся из менеджера секретов, в git не попадают):
#
#      kubectl -n ryadom-db create secret generic ryadom-db-credentials \
#        --from-literal=username=ryadom \
#        --from-literal=password='<пароль, минимум 16 символов>'
#
#      kubectl -n ryadom-db create secret generic cnpg-backup-s3-credentials \
#        --from-literal=AWS_ACCESS_KEY_ID='<ключ сервисного аккаунта YC>' \
#        --from-literal=AWS_SECRET_ACCESS_KEY='<секретный ключ>'
#
# S3-ключи: сервисный аккаунт с ролью storage.editor (сужение до bucket
# policy — позже, как в референсе). Bucket создаётся в Yandex Object Storage
# заранее, имя подставить в 01-cnpg-cluster.yaml.
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: ryadom-db-credentials
  namespace: ryadom-db
type: Opaque
data:
  # base64("ryadom")
  username: cnlhZG9t
  # echo -n '<пароль>' | base64  (см. k8s/prepare-secrets.sh)
  password: <CHANGE_ME_BASE64>
---
# Суперпользователь postgres (.spec.superuserSecret в 01-cnpg-cluster.yaml).
# Используется админ-Job'ами (langfuse/manifests/01-job-create-db.yaml и т.п.).
# username обязан быть "postgres" (требование CNPG).
apiVersion: v1
kind: Secret
metadata:
  name: ryadom-db-superuser
  namespace: ryadom-db
type: Opaque
data:
  # base64("postgres")
  username: cG9zdGdyZXM=
  password: <CHANGE_ME_BASE64>
---
apiVersion: v1
kind: Secret
metadata:
  name: cnpg-backup-s3-credentials
  namespace: ryadom-db
type: Opaque
data:
  AWS_ACCESS_KEY_ID: <CHANGE_ME_BASE64>
  AWS_SECRET_ACCESS_KEY: <CHANGE_ME_BASE64>
