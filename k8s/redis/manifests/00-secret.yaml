# =============================================================================
# ШАБЛОН секрета Redis (namespace ryadom-db) — НЕ КОММИТИТЬ реальные значения
# =============================================================================
# Заполнение — напрямую (значение хранится локально у администратора):
#
#   kubectl -n ryadom-db create secret generic redis-credentials \
#     --from-literal=REDIS_PASSWORD='<пароль, минимум 16 символов>'
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: ryadom-db
type: Opaque
data:
  # echo -n '<пароль>' | base64
  REDIS_PASSWORD: <CHANGE_ME_BASE64>
