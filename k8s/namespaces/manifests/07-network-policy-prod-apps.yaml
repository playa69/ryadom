# =============================================================================
# NetworkPolicy — порты сервисов app/ в namespace prod
# =============================================================================
# Дополняет 01-network-policy-prod.yaml. NetworkPolicy аддитивны (union
# allow-правил), поэтому этот файл ТОЛЬКО расширяет разрешения: ничего
# существующего не меняет и не ослабляет default-deny.
#
# Зачем: prod-allow-ingress-istio-gateway пускает от istio-ingressgateway лишь
# порты 80/8000/8080, а сервисы из app/ слушают 3000 (landing), 3001 (admin),
# 3002 (api), 3003 (web), 3004 (pwa). Политика применяется к порту ПОДА (после DNAT
# сервиса), поэтому нужны именно эти порты, а не 80 у Service.
#
# Scrape /metrics api от Prometheus (ns monitoring) на :3002 — отдельная политика ниже, только для app-api
# (в 01 для monitoring разрешён лишь :15090 сайдкаров).
#
# Что здесь НЕ открыто (и работает уже сейчас, см. 01-network-policy-prod.yaml):
#   - egress к PG/Redis в ryadom-db (5432/6379/26379), DNS, HTTPS наружу, istiod;
#   - kubelet-пробы на :15020 (все пробы приложений — httpGet через istio).
# Egress для SMTP — отдельная политика ниже (prod-allow-egress-smtp-postbox):
# только app-api/app-admin, только :465, только в диапазон Yandex Cloud.
# Egress в ns agent не добавлен: агента в кластере пока нет.
#
# Применять: kubectl apply -f k8s/namespaces/manifests/07-network-policy-prod-apps.yaml
# (поимённо; не `-f k8s/namespaces/manifests/` целиком без нужды)
# =============================================================================

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prod-allow-ingress-istio-gateway-apps
  namespace: prod
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
          podSelector:
            matchLabels:
              istio: ingressgateway
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 3001
        - protocol: TCP
          port: 3002
        - protocol: TCP
          port: 3003
        - protocol: TCP
          port: 3004

---
# Scrape /metrics api (self_check_crisis_total) от Prometheus. Только поды app-api и только их порт: остальным
# сервисам prod это правило ничего не открывает. Обратная сторона — egress в prometheus-allow-egress-scrape
# (monitoring/manifests/01-network-policy.yaml), сам сбор — k8s/app/api/04-servicemonitor.yaml. Применять до него.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prod-allow-ingress-monitoring-scrape-api
  namespace: prod
spec:
  podSelector:
    matchLabels:
      app: app-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 3002

---
# Исходящая почта по SMTPS (порт 465, TLS с первого байта — без STARTTLS-даунгрейда).
# Письма шлют только api (регистрация, подтверждение, сброс пароля) и admin (код
# входа), поэтому политика выбирает только их. Calico фильтрует по IP, а не по
# имени, поэтому разрешены диапазоны, а не отдельные адреса:
#   - Unisender Go, smtp.go2.unisender.ru (на 2026-10-11 резолвится в
#     31.184.200.6, .70 и .134) — 31.184.200.0/24. Сейчас почта идёт через него;
#   - Yandex Cloud Postbox, postbox.cloud.yandex.net (158.160.78.193) —
#     158.160.0.0/16. Правило оставлено для отката: 2026-10-11 Postbox перестал
#     отвечать на TCP, поэтому сервис сменили.
# Если почта вдруг перестала уходить после смены адреса —
# `nslookup smtp.go2.unisender.ru` и поправить cidr.
# Имя политики историческое (она появилась для Postbox).
# Применять вместе с переключением EMAIL_TRANSPORT=smtp в 00-app-config.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prod-allow-egress-smtp-postbox
  namespace: prod
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - app-api
          - app-admin
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 31.184.200.0/24
      ports:
        - protocol: TCP
          port: 465
    - to:
        - ipBlock:
            cidr: 158.160.0.0/16
      ports:
        - protocol: TCP
          port: 465
