# =============================================================================
# NetworkPolicy — порты сервисов app/ в namespace prod
# =============================================================================
# Дополняет 01-network-policy-prod.yaml. NetworkPolicy аддитивны (union
# allow-правил), поэтому этот файл ТОЛЬКО расширяет разрешения: ничего
# существующего не меняет и не ослабляет default-deny.
#
# Зачем: prod-allow-ingress-istio-gateway пускает от istio-ingressgateway лишь
# порты 80/8000/8080, а сервисы из app/ слушают 3000 (landing), 3001 (admin),
# 3002 (api), 3003 (web), 3004 (pwa). Политика применяется к порту ПОДА (после DNAT
# сервиса), поэтому нужны именно эти порты, а не 80 у Service.
#
# Что здесь НЕ открыто (и работает уже сейчас, см. 01-network-policy-prod.yaml):
#   - egress к PG/Redis в ryadom-db (5432/6379/26379), DNS, HTTPS наружу, istiod;
#   - kubelet-пробы на :15020 (все пробы приложений — httpGet через istio).
# Egress для SMTP — отдельная политика ниже (prod-allow-egress-smtp-postbox):
# только app-api/app-admin, только :465, только в диапазон Yandex Cloud.
# Egress в ns agent не добавлен: агента в кластере пока нет.
#
# Применять: kubectl apply -f k8s/namespaces/manifests/07-network-policy-prod-apps.yaml
# (поимённо; не `-f k8s/namespaces/manifests/` целиком без нужды)
# =============================================================================

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prod-allow-ingress-istio-gateway-apps
  namespace: prod
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
          podSelector:
            matchLabels:
              istio: ingressgateway
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 3001
        - protocol: TCP
          port: 3002
        - protocol: TCP
          port: 3003
        - protocol: TCP
          port: 3004

---
# Исходящая почта через Yandex Cloud Postbox: postbox.cloud.yandex.net:465
# (SMTPS, TLS с первого байта — без STARTTLS-даунгрейда). Письма шлют только
# api (регистрация, подтверждение, сброс пароля) и admin (код входа), поэтому
# политика выбирает только их. Calico фильтрует по IP, а не по имени, и адрес
# Postbox может смениться, поэтому разрешён не один IP (на 2026-10-05 имя
# резолвится в 158.160.78.193), а весь диапазон Yandex Cloud 158.160.0.0/16.
# Если почта вдруг перестала уходить после смены адреса Postbox —
# `nslookup postbox.cloud.yandex.net` и поправить cidr.
# Применять вместе с переключением EMAIL_TRANSPORT=smtp в 00-app-config.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prod-allow-egress-smtp-postbox
  namespace: prod
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - app-api
          - app-admin
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 158.160.0.0/16
      ports:
        - protocol: TCP
          port: 465
