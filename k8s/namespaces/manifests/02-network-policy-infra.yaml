# =============================================================================
# Network Policies — изоляция namespace infra
# =============================================================================
# infra — служебные workload'ы БЕЗ istio-injection (см. 00-namespaces.yaml),
# поэтому правил allow-egress-istiod и kubelet-probes:15020 здесь нет
# (сайдкаров нет — нечего разрешать).
# Модель та же: default-deny ingress+egress, далее — явные allow.
# =============================================================================

---
# Default-deny: блокируем весь ingress и egress в infra
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: infra-default-deny-all
  namespace: infra
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
# Входящий трафик ТОЛЬКО от istio-ingressgateway и pod-to-pod внутри
# namespace. Порты: 80/8000/8080 — типовые; 3000 — Langfuse UI
# (langfuse/manifests/02-gateway.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: infra-allow-ingress-istio-gateway
  namespace: infra
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
          podSelector:
            matchLabels:
              istio: ingressgateway
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8080

---
# Scrape от Prometheus (ns monitoring): :3000 — Langfuse web (если включим
# prom-метрики), :9091 — типовой metrics-порт worker'ов. Сейчас Langfuse
# prom-метрики не отдаёт — порты открыты на будущее; обратная сторона —
# egress-правило prometheus в monitoring/manifests/01-network-policy.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: infra-allow-ingress-monitoring-scrape
  namespace: infra
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 9091

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: infra-allow-ingress-same-namespace
  namespace: infra
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}

---
# Приём трейсов от агента (ns agent) в Langfuse web (:3000). Обратная сторона —
# agent-allow-egress-langfuse в 05-network-policy-agent.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: infra-allow-ingress-agent-langfuse
  namespace: infra
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: langfuse
      app.kubernetes.io/component: web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agent
      ports:
        - protocol: TCP
          port: 3000

---
# Исходящий трафик: DNS, внутренний трафик namespace, внешний HTTPS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: infra-allow-egress
  namespace: infra
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # DNS (CoreDNS в kube-system)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Pod-to-pod внутри namespace (Langfuse → свой ClickHouse/Redis и т.п.)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra
    # PostgreSQL и Redis в ryadom-db (Langfuse web/worker → CNPG :5432;
    # :6379 — общий Redis, если сервисы infra переключатся на него)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ryadom-db
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        # Redis Sentinel (битнами redis+sentinel с 2026-10-01)
        - protocol: TCP
          port: 26379
    # Внешний HTTPS — ТОЛЬКО Yandex Object Storage (blobs Langfuse).
    # FQDN в NetworkPolicy не поддерживается (Calico OSS), поэтому пин
    # на A-записи storage.yandexcloud.net (снято 2026-10-01).
    # ПЕРЕПРОВЕРЯТЬ при сбоях загрузки blobs: dig storage.yandexcloud.net
    - to:
        - ipBlock:
            cidr: 213.180.193.243/32
      ports:
        - protocol: TCP
          port: 443
