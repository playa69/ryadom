# =============================================================================
# ServiceAccount developer — общий аккаунт коллег-разработчиков
# =============================================================================
# Один SA на всех коллег (решение владельца 2026-10-02). Живёт в namespace
# agent; права выдаются RoleBinding'ами в agent/backend (deploy),
# ryadom-db/infra (debug: логи + port-forward) и ClusterRoleBinding'ом
# (read-only namespaces/nodes) — см. 01..03-clusterrole-developer-*.yaml.
#
# Secret developer-token — long-lived токен для kubeconfig коллег
# (~/.config/ryadom/developer-kubeconfig.yaml, генерируется по паттерну
# UnionApp make-developer-kubeconfig.sh). С 1.24 SA-токены автоматически
# не создаются — нужен явный Secret с annotation.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: developer
  namespace: agent
  labels:
    app.kubernetes.io/part-of: ryadom
---
apiVersion: v1
kind: Secret
metadata:
  name: developer-token
  namespace: agent
  annotations:
    kubernetes.io/service-account.name: developer
type: kubernetes.io/service-account-token
