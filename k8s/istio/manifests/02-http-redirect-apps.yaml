# =============================================================================
# HTTPRoute http-redirect-apps — редирект 80→443 для поддоменов (istio-system)
# =============================================================================
# Отдельный ресурс рядом с http-redirect (корневой домен, в
# 01-gateway-api-gateway.yaml): существующий роут не меняем. Цепляется к
# listener http :80 (без hostname). ACME solver-роуты
# (/.well-known/acme-challenge/*) специфичнее catch-all редиректа и матчатся
# раньше — выпуск ryadom-apps-tls не ломается.
#
# Применять вместе с правкой Gateway (после выпуска сертификата).
# =============================================================================

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-redirect-apps
  namespace: istio-system
spec:
  parentRefs:
    - name: ryadom-gateway
      namespace: istio-system
      sectionName: http
  hostnames:
    - app.xn----htbtgjker8b3a2c.xn--p1ai
    - web.xn----htbtgjker8b3a2c.xn--p1ai
    - admin.xn----htbtgjker8b3a2c.xn--p1ai
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
