[project]
name = "ryadom-agent"
version = "0.1.0"
description = "Агент «Слышу Рядом» — упрощённая версия: контракт agent-api, шаблонные ответы, озвучка (espeak-ng / SaluteSpeech)"
requires-python = ">=3.12"
# Намеренно минимум. LLM, LangGraph, БД, память и классификаторы из openspec/changes/add-agent-service
# подключаются позже; сейчас сервис проверяет API, озвучку и интеграцию с app.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
