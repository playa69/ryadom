[project]
name = "ryadom-agent"
version = "0.1.0"
description = "Агент «Слышу Рядом» — упрощённая версия: контракт agent-api, ответы чат-модели и распознавание речи через прокси, озвучка (Qwen TTS / SaluteSpeech / espeak-ng)"
requires-python = ">=3.12"
# Намеренно минимум. LangGraph и классификаторы из openspec/changes/add-agent-service не подключены;
# вызовы прокси, Cognee и Langfuse usage — обычный httpx, без SDK.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    # Трейсинг LLM в self-hosted Langfuse (сервер v3 → SDK v3, OTel; v4 требует сервера v4).
    # Используется только при LANGFUSE_ENABLED=true (app/core/tracing.py).
    "langfuse>=3,<4",
    # Режим VOICE_PIPELINE=gemini_live (речь в речь через Gemini Live). Импортируется только в нём.
    "google-genai>=2.0",
    # Диалоги в PostgreSQL (DIALOG_DATABASE_URL, app/services/dialog_db.py). Синхронный драйвер и пул:
    # интерфейс хранилища диалогов синхронный (threading.Lock + asyncio.to_thread в DialogStore).
    "psycopg[binary,pool]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
