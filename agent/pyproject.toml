[project]
name = "ryadom-agent"
version = "0.1.0"
description = "Агент «Слышу Рядом» — упрощённая версия: контракт agent-api, ответы чат-модели и распознавание речи через прокси, озвучка (Qwen TTS / SaluteSpeech / espeak-ng)"
requires-python = ">=3.12"
# Намеренно минимум. LangGraph, БД, память и классификаторы из openspec/changes/add-agent-service
# подключаются позже; чат и распознавание — обычные HTTP-вызовы прокси через httpx, без SDK.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "prometheus-client>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
