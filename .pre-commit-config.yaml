# Хуки коммита. Установка один раз на машине: pre-commit install
# (сам pre-commit ставится как инструмент: uv tool install pre-commit).
# Проверяется только backend/: ruff линтит (с автофиксом) и форматирует изменённые файлы.
# alembic/ (автогенерируемые миграции) и tests/ не трогаем.
exclude: ^backend/(alembic|tests)/
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff-check
        name: ruff lint (backend)
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        name: ruff format (backend)
        files: ^backend/
